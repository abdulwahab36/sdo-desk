<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5c63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>SDO Desk</title>
<style>
:root{--bg:#f4f5f2;--card:#fff;--ink:#1c2321;--mute:#66706c;--line:#dde1dc;--acc:#0f5c63;--accs:#e2efef;--red:#b3261e;--reds:#fbe9e7;--amb:#9a6400;--ambs:#fdf3dc;--ok:#2e7d32;--oks:#e6f2e6}
@media (prefers-color-scheme:dark){:root{--bg:#111514;--card:#1b201f;--ink:#e7ebe9;--mute:#97a19d;--line:#2c3331;--acc:#5fb3b9;--accs:#1d3335;--red:#ef8a80;--reds:#3a2120;--amb:#e7b45a;--ambs:#352a15;--ok:#7fc683;--oks:#1d2e1e}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
header h1{font-size:17px;margin:0;font-weight:650;white-space:nowrap;flex:1}
.ham{border:0;background:none;color:var(--ink);padding:6px;margin-left:-4px;display:flex}
.ham svg{width:24px;height:24px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px;flex:none}
.seg button{border:0;background:none;color:var(--mute);padding:6px 9px;border-radius:8px;font:inherit;font-size:13px}
.seg button.on{background:var(--acc);color:#fff}
main{max-width:720px;margin:0 auto;padding:12px 14px 110px}
nav.bot{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.bot a{flex:1;text-align:center;color:var(--mute);text-decoration:none;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.bot a.on{color:var(--acc);font-weight:600}
nav.bot svg{width:22px;height:22px}
.badge{position:absolute;top:-3px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;line-height:16px;font-weight:600}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:16px;border:0;background:var(--acc);color:#fff;font-size:28px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.22);z-index:6}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);background:var(--bg);z-index:41;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top)) 0 24px;box-shadow:4px 0 18px rgba(0,0,0,.2)}
.drawer .dh{padding:0 18px 10px;font-weight:700;font-size:18px}
.drawer .dp{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;font-weight:600;font-size:15px;cursor:pointer;border-top:1px solid var(--line)}
.drawer .dp em{font-style:normal;color:var(--mute);font-weight:400;font-size:13px}
.drawer .dc a{padding-left:34px}
.prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--ok)}
.drawer .dg{padding:12px 18px 4px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.drawer a{display:flex;justify-content:space-between;align-items:center;padding:11px 18px;color:var(--ink);text-decoration:none;font-size:15px}
.drawer a.on{background:var(--accs);color:var(--acc);font-weight:600}
.drawer a span{font-size:12px;color:var(--mute)}
.drawer a span.r{color:#fff;background:var(--red);border-radius:9px;padding:0 6px;line-height:18px}
h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:18px 0 8px;font-weight:600}
.pt{font-size:21px;margin:6px 0 10px;line-height:1.25}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.card.over{border-left:4px solid var(--red)}
.card.today{border-left:4px solid var(--amb)}
.card.warn{background:var(--ambs);border-color:transparent}
.card.note{background:var(--accs);border-color:transparent}
.pad0{padding:0;overflow:hidden}
.ct{font-weight:600}
.meta{color:var(--mute);font-size:13px;margin-top:2px}
.tags{margin-bottom:4px}
.chip{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:6px;background:var(--accs);color:var(--acc);margin:0 4px 2px 0}
.chip.r{background:var(--reds);color:var(--red)}
.chip.a{background:var(--ambs);color:var(--amb)}
.chip.g{background:var(--oks);color:var(--ok)}
.acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:8px 12px;font:inherit;font-size:14px;text-decoration:none;display:inline-block;text-align:center;cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.d{color:var(--red)}
.btn.s{padding:6px 10px;font-size:13px}
.wide{width:100%;display:block}
.mt{margin-top:10px}
.fld{display:block;margin-bottom:10px}
.fld span{display:block;font-size:12.5px;color:var(--mute);margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}
textarea{resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.back{color:var(--acc);text-decoration:none;font-size:14px;display:inline-block;padding:4px 0}
.chk{display:flex;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk input{width:20px;height:20px;flex:none;margin:0}
.strike{text-decoration:line-through;color:var(--mute)}
.lrow{padding:9px 12px;border-bottom:1px solid var(--line);display:block;color:var(--ink);text-decoration:none}
.lrow:last-child{border-bottom:0}
.card .lrow{padding:8px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:14px;margin:0}
.kv dt{color:var(--mute)}
.kv dd{margin:0;word-break:break-word}
.det{margin:10px 0 0}
.stg{margin:0;padding:0;list-style:none}
.stg li{padding:4px 0;color:var(--mute);font-size:14px}
.stg li.d{color:var(--ink)}
.stg li.c{font-weight:650;color:var(--acc)}
.tl{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.cal.head div{text-align:center;font-size:11.5px;color:var(--mute)}
.cd{background:var(--card);border:1px solid var(--line);border-radius:9px;min-height:46px;padding:4px 5px;position:relative;font-size:13px}
.cd.td{border-color:var(--acc);font-weight:700}
.cd.sel{background:var(--accs)}
.cd i{position:absolute;bottom:4px;right:4px;font-style:normal;font-size:10.5px;background:var(--acc);color:#fff;border-radius:8px;padding:0 5px;line-height:15px}
.cd i.r{background:var(--red)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.stats.s4{grid-template-columns:repeat(4,1fr)}
.stats div,.stats a{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;text-decoration:none;color:var(--ink)}
.stats b{display:block;font-size:19px}
.stats span{display:block}
.dtile.full{grid-column:1/-1}
.stats span{font-size:11.5px;color:var(--mute)}
.stats .rd b{color:var(--red)}
.stats .am b{color:var(--amb)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (min-width:640px){.dgrid{grid-template-columns:1fr 1fr 1fr}}
.dtile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;text-decoration:none;color:var(--ink);display:block}
.dtile .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.dtile .hd b{font-size:14.5px}
.dtile .hd em{font-style:normal;font-size:20px;font-weight:700}
.dl{font-size:12.5px;color:var(--mute);line-height:1.45}
.rd{color:var(--red)!important;font-weight:600}
.am{color:var(--amb)}
.srch{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--mute);margin-bottom:12px;text-decoration:none}
.srch svg{width:18px;height:18px;flex:none}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.fchips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:5px 11px;font:inherit;font-size:13px}
.fchips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.center{text-align:center}
.empty{color:var(--mute);text-align:center;padding:22px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));background:#222;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:92vw}
#toast.on{opacity:1;pointer-events:auto}
#toast button{background:none;border:0;color:#7fd3d9;font:inherit;font-weight:700;margin-left:10px;padding:0}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:40}
.sheetbox{position:fixed;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;background:var(--bg);border-radius:16px 16px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));z-index:41;max-width:720px;margin:0 auto}
a{color:var(--acc)}
.hello .big{font-size:20px;font-weight:650}
</style>
</head>
<body>
<header><button class="ham" onclick="openDrawer()" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><h1 onclick="go('#home')" style="cursor:pointer">SDO Desk</h1><button class="ham" onclick="go('#search')" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button><div class="seg" id="seg"></div></header>
<main id="main"></main>
<button class="fab" onclick="A.fab()" aria-label="Add">+</button>
<div id="toast"></div>
<datalist id="desigs"></datalist>
<script src="fflate.js"></script>
<script>
'use strict';
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/864e5);
const fmtD=s=>{if(!s)return '';const d=new Date(s+'T00:00:00');if(isNaN(d))return s;const o={day:'2-digit',month:'short'};if(d.getFullYear()!==new Date().getFullYear())o.year='numeric';return d.toLocaleDateString('en-GB',o)};
const fmtTs=ts=>new Date(ts).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const rel=s=>{const n=diffDays(s,today());return n<0?(-n)+'d overdue':n===0?'today':n===1?'tomorrow':'in '+n+' days'};
const num=x=>{const n=Number(x);return isNaN(n)?String(x):(Math.round(n*10)/10).toLocaleString('en-PK')};
const go=h=>{location.hash=h.replace(/^#/,'')};
const isUrl=u=>/^https?:\/\//i.test(u||'');
const wa=ph=>{let d=String(ph||'').replace(/\D/g,'');if(d.startsWith('0'))d='92'+d.slice(1);return d};
const fsize=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';

/* ================= data ================= */
const KEY='sdodesk.v1';
function DEF(){const r=[];['K','I'].forEach(s=>['Check gauge proforma','Check eFOES','Check SEN activity on WhatsApp group'].forEach(t=>r.push({id:uid(),sub:s,title:t})));
 return {v:2,offSheets:{},psMaps:{},items:[],people:[],vehicle:[],inbox:[],visits:[],canals:[],log:[],inspNotes:{},routineDone:{},routines:r,settings:{subs:{K:'Kundian',I:'Isakhel'},lastBackup:null,lastNotify:null}}}
let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.items))S=DEF();
function fillDefaults(){const d=DEF();for(const k in d)if(S[k]===undefined)S[k]=d[k];if(!S.settings.subs)S.settings.subs=d.settings.subs}
fillDefaults();
let SUB='A';try{SUB=localStorage.getItem('sdodesk.sub')||'A'}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save. Storage blocked or full.')}}
let UNDO=null;
function snap(){UNDO=JSON.stringify(S)}
function undo(){if(!UNDO)return;S=JSON.parse(UNDO);UNDO=null;save();render();toast('Undone')}
function log(text,o){S.log.push({ts:Date.now(),date:today(),sub:o&&o.sub&&o.sub!=='B'?o.sub:'',text,id:o&&o.id&&o.type?o.id:null});if(S.log.length>6000)S.log.splice(0,S.log.length-6000)}
function prune(){const cut=addDays(today(),-200);for(const k in S.routineDone)if(k<cut)delete S.routineDone[k]}

/* ---------- file store (IndexedDB) ---------- */
let _db=null;
function idb(){return _db||(_db=new Promise((res,rej)=>{const r=indexedDB.open('sdodesk-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
function fTx(mode,fn){return idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction('files',mode);const st=tx.objectStore('files');let out;const r=fn(st);if(r)r.onsuccess=()=>{out=r.result};tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error)}))}
const fPut=rec=>fTx('readwrite',st=>st.put(rec));
const fGet=id=>fTx('readonly',st=>st.get(id));
const fAll=()=>fTx('readonly',st=>st.getAll());
const fDel=id=>fTx('readwrite',st=>st.delete(id));
const blobToB64=b=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(b)});
async function fileGC(){try{const used=new Set();S.items.forEach(it=>(it.links||[]).forEach(l=>{if(l.fileId)used.add(l.fileId)}));const all=await fAll();for(const r of all)if(!used.has(r.id))await fDel(r.id)}catch(e){}}

/* ---------- model ---------- */
const DESIGS=['XEN','SE','Chief Engineer','SDO','Sub Engineer (SEN)','Sub Divisional Clerk (SDC)','Sub Divisional Reader (SDR)','SDR / Zilladar','Zilladar','Canal Patwari','Signaller','Mate','Mistry','Earthwork Mistry','Gauge Reader','Regular Beldar','Beldar','Artificer','Telephone Attendant','Naib Qasid','Dak Runner','Chowkidar','Chowkidar cum Cook','Cook','Sweeper','Drawing Branch','NESPAK','AAG / Law Officer','Police (SHO)','Other'];
const dIdx=p=>{const i=DESIGS.indexOf(p.designation);return i<0?99:i};
const F=(k,l,t,o)=>({k,l,t:t||'text',o});
const T={
 task:{n:'Follow-up',pl:'Follow-ups',daily:1,f:[F('title','Task / direction'),F('source','Source','sel',['XEN direction','Meeting','SE / Chief direction','Canal wire','Self','Other']),F('owner','Assigned to','person'),F('due','Deadline','date'),F('details','Details','textarea')]},
 complaint:{n:'Complaint',pl:'Complaints',daily:1,f:[F('source','Source','sel',['WRIMS (PMIU)','Ombudsman Punjab','Other']),F('refNo','Complaint No'),F('title','Subject'),F('received','Received on','date'),F('due','Reply due (WRIMS: auto 3 days if left blank)','date'),F('side','Side','sel',['Technical','Revenue']),F('owner','Report from','person'),F('details','Details','textarea')]},
 estimate:{n:'Estimate',pl:'Estimates',daily:0,f:[F('title','Name of work'),F('estNo','Estimate No'),F('estDate','Estimate date','date'),F('amount','Amount (Rs)','num'),F('authority','Sanctioning authority','sel',['XEN','SE','Chief Engineer']),F('owner','Sub Engineer','person'),F('canal','Canal / channel','list','canals'),F('due','Target date','date'),F('details','Details','textarea')]},
 theft:{n:'Water theft',pl:'Water theft',daily:1,f:[F('title','Location (canal / RD / outlet)'),F('canal','Canal / channel','list','canals'),F('reportedOn','Reported on','date'),F('owner','Reported by (SEN)','person'),F('zildar','Zilladar','person'),F('culprits','Culprits (Fard-e-Qasran)','textarea'),F('hearing','Hearing date','date'),F('decision','Decision','sel',['Pending','Fine','Robkar / FIR']),F('fineAmount','Fine (Rs)','num'),F('receiptNo','Receipt No'),F('robkarNo','Robkar No / date'),F('policeStation','Police station'),F('firNo','FIR No'),F('tawanStatus','Tawan case','sel',['Not started','Case submitted by Zilladar','Notice issued (SDR)','Decided']),F('tawanHearing','Tawan hearing date','date'),F('tawanAmount','Tawan (Rs)','num'),F('details','Details','textarea')]},
 court:{n:'Court case',pl:'Court cases',daily:0,f:[F('title','Case title'),F('refNo','Case No'),F('court','Court','sel',['Civil Court','Lahore High Court','Other']),F('courtName','Court / bench'),F('hearing','Next hearing','date'),F('attendTime','Attend time','time'),F('attendWhere','Attend at (e.g. AAG office)'),F('owner','Handled by','person'),F('details','Details','textarea')]},
 inquiry:{n:'Inquiry',pl:'Inquiries',daily:0,f:[F('title','Subject of inquiry'),F('accusedId','Accused (pick from People)','person'),F('accused','or type name (if not in People)'),F('accusedDesig','Designation (auto when picked)','sel',['Sub Engineer (SEN)','Mate','Mistry','Gauge Reader','Signaller','Beldar','Other']),F('io','Inquiry Officer (when you are DR)'),F('chargeDate','Charge sheet date','date'),F('hearing','Next date','date'),F('details','Details','textarea')]},
 wire:{n:'Canal wire',pl:'Canal wires',daily:0,f:[F('dir','Wire','sel',['Received','Issued']),F('refNo','Wire No'),F('wireDate','Date','date'),F('wireTime','Time','time'),F('party','From / To','list','parties'),F('owner','Signaller','person'),F('title','Subject'),F('action','Action','sel',['Information only','Needs action']),F('assign','Action by (person)','person'),F('due','Action deadline','date'),F('details','Details','textarea')]},
 letter:{n:'Letter',pl:'Correspondence',daily:0,f:[F('dir','Letter','sel',['Issued','Received']),F('letterNo','Letter No'),F('letterDate','Letter date','date'),F('party','To / From (office or department)','list','parties'),F('title','Subject'),F('canal','Canal / channel','list','canals'),F('rd','RD / outlet / site'),F('replyDue','Reply expected by (leave blank if none)','date'),F('details','Gist / keywords','textarea')]},
 event:{n:'Event',pl:'Meetings & events',daily:0,f:[F('title','Title'),F('due','Date','date'),F('time','Time','time'),F('place','Place'),F('details','Details','textarea')]},
 resource:{n:'Resource',pl:'Resources',daily:0,f:[F('title','Title'),F('cat','Category','sel',['Department manuals','Canal details','Notifications & orders','Rules & SOPs','Proformas & forms','Sheets & data','Maps & L-sections','Police jurisdiction','Staff lists','Other']),F('details','Notes / keywords','textarea')]},
 pmiu:{n:'PMIU wire',pl:'PMIU wires',daily:0,f:[F('refNo','PMIU canal wire No'),F('wireDate','Inspection / wire date','date'),F('canal','Canal(s) visited','list','canals'),F('title','Subject (auto if blank)'),F('meetingDate','SE meeting date','date'),F('details','Notes','textarea')]},
 template:{n:'Template',pl:'Templates',daily:0,f:[F('title','Template name'),F('cat','Category','sel',['Letter','Canal wire','Robkar / notice','Inspection note','Reply / report','Proforma','Other']),F('body','Text with blanks (optional): {canal} {rd} {date} {sen} {no} {subject} {party} {subdivision} {ps}','textarea'),F('details','Keywords','textarea')]},
 place:{n:'Place',pl:'Places',daily:0,f:[F('title','Name'),F('cat','Category','sel',['Rest house','Office (AC / DC / XEN / SE)','Police station','Head / regulator / gauge','Canal site / outlet','Court','Hospital','Other']),F('address','Address / landmark'),F('lat','Latitude'),F('lng','Longitude'),F('mapUrl','Google Maps link (optional)'),F('contact','Contact person'),F('phone','Phone','tel'),F('details','Notes','textarea')]}
};
const DEFV={pmiu:['wireDate'],complaint:['received'],estimate:['estDate'],theft:['reportedOn'],wire:['wireDate'],event:['due'],letter:['letterDate']};
const STG={
 complaint:()=>['Received','Sent to staff for report','Report received','Reply submitted'],
 estimate:it=>{const a=['Prepared by SEN','Numbered by SDC','Signed by SDO','Checked by Division Drawing Branch','Signed by XEN'];
  if(it.authority==='SE'||it.authority==='Chief Engineer')a.push('Checked by Circle Drawing Branch','Signed by SE');

  if(it.type==='event'){if(kd===t)g.today.push(it);return}
  const upcoming=kd&&kd>=t&&kd<=soon;
  if(it.followUp&&it.followUp>t&&!upcoming){g.later++;return}
  if(kd&&kd<t)g.over.push(it);else if(kd===t)g.today.push(it);else if(upcoming)g.soon.push(it);
  else if(it.followUp&&it.followUp<=t)g.fu.push(it);else if(kd&&kd>soon)g.later++;else if(T[it.type].daily)g.fu.push(it);else g.later++});
 const so=(a,b)=>((keyDate(a)||'9')+a.createdAt).localeCompare((keyDate(b)||'9')+b.createdAt);
 ['over','today','soon','fu'].forEach(k=>g[k].sort(so));return g}

 if(it.type==='court'&&isOpen(it))h+=`<h2>Record hearing</h2><div class="card"><input id="hOut" placeholder="What happened (adjourned, reply filed …)"><label class="fld mt"><span>Next hearing</span><input type="date" id="hNext"></label><button class="btn p" onclick="A.hear('${id}')">Save hearing</button></div>`;

 const kids=S.items.filter(x=>x.rel===id).sort((a,b)=>itemDate(b).localeCompare(itemDate(a)));

 if(kids.length||lb)h+=`<h2>Linked records (${kids.length})</h2>${kids.map(x=>card(x,false)).join('')}${lb?`<div class="acts" style="margin-top:0">${lb}</div>`:''}`;
 const tl=[...(it.stages||[]).map(s=>({k:s.date+'T23',w:fmtD(s.date),x:'Stage: '+s.name+(s.note?' — '+s.note:'')})),...(it.notes||[]).map(n=>({k:ymd(new Date(n.ts))+'T'+String(n.ts),w:fmtTs(n.ts),x:n.text}))].sort((a,b)=>b.k.localeCompare(a.k));

 if(it.type==='pmiu')h+=dataLists();

 return l.map(p=>`<div class="lrow" onclick="A.ppSet('${p.id}')"><b>${esc(p.name)}</b> <span class="meta">${esc([p.designation,p.section].filter(Boolean).join(' · '))}</span></div>`).join('')||'<p class="empty">No match.</p>'}
A.ppSet=id=>{const f=$('#'+PPK),b=$('#'+PPK+'_b');if(f)f.value=id;const p=person(id);if(b)b.innerHTML=p?esc(p.name)+' <span class="meta">'+esc(p.designation)+'</span>':'<span class="meta">Tap to choose a person…</span>';closeSheet()};
A.ppNew=()=>{const n=$('#ppn').value.trim();if(!n)return toast('Enter a name');const p={id:uid(),name:n,designation:$('#ppd').value.trim()||'Other',sub:SUB==='A'?'K':SUB,section:'',posting:'',phone:'',cnic:'',notes:''};S.people.push(p);log('Added person: '+n,{sub:p.sub});save();A.ppSet(p.id);toast('Added '+n)};
A.renLink=(id,i)=>{const it=get(id);const l=it.links[i];const v=prompt('New name for this document',l.label||l.name||'');if(v===null||!v.trim())return;snap();l.label=v.trim();save();render()};

/* ================= reminders ================= */
async function notify(title,body){try{const r=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(r)await r.showNotification(title,{body,icon:'icon-192.png',badge:'icon-192.png'});else new Notification(title,{body})}catch(e){}}
function dailyNotify(){if(!('Notification' in window)||Notification.permission!=='granted')return;const t=today();if(S.settings.lastNotify===t)return;const c=counts(true);S.settings.lastNotify=t;save();if(c.over||c.today)notify('SDO Desk',c.over+' overdue, '+c.today+' due today')}
function checkSoon(){if(!('Notification' in window)||Notification.permission!=='granted')return;const t=today(),now=new Date();let ch=false;
 S.items.forEach(it=>{if(!isOpen(it))return;let d=null,tm=null,l='';if(it.type==='court'){d=it.hearing;tm=it.attendTime;l='Court'}else if(it.type==='event'){d=it.due;tm=it.time;l='Event'}
  if(d!==t||!tm||it._nt===t)return;const hm=tm.split(':').map(Number);const mins=hm[0]*60+hm[1]-(now.getHours()*60+now.getMinutes());
  if(mins>0&&mins<=120){it._nt=t;ch=true;notify(l+' at '+tm,it.title+(it.attendWhere?' — '+it.attendWhere:it.place?' — '+it.place:''))}});if(ch)save()}

/* ================= start ================= */
$('#desigs').innerHTML=DESIGS.map(d=>`<option value="${esc(d)}">`).join('');
window.addEventListener('hashchange',render);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(!/^edit/.test(curView())&&curView()!=='search')render();dailyNotify();checkSoon()}});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
prune();render();loadTexts();dailyNotify();checkSoon();setInterval(checkSoon,300000);setTimeout(fileGC,4000);
</script>
