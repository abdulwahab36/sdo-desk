<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">

<title>SDO Desk</title>
<style>
:root{--bg:#f3f4f1;--card:#fcfcfa;--ink:#1c2321;--mute:#66706c;--line:#dde1dc;--acc:#0f5c63;--accs:#e2efef;--red:#b3261e;--reds:#fbe9e7;--amb:#9a6400;--ambs:#fdf3dc;--ok:#2e7d32;--oks:#e6f2e6}
@media (prefers-color-scheme:dark){:root{--bg:#111514;--card:#1b201f;--ink:#e7ebe9;--mute:#97a19d;--line:#2c3331;--acc:#5fb3b9;--accs:#1d3335;--red:#ef8a80;--reds:#3a2120;--amb:#e7b45a;--ambs:#352a15;--ok:#7fc683;--oks:#1d2e1e}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
header h1{font-size:17px;margin:0;font-weight:650;white-space:nowrap;flex:1}
.ham{border:0;background:none;color:var(--ink);padding:6px;margin-left:-4px;display:flex}
.ham svg{width:24px;height:24px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px;flex:none}
.seg button{border:0;background:none;color:var(--mute);padding:6px 9px;border-radius:6px;font:inherit;font-size:13px}
.seg button.on{background:var(--acc);color:#fff}
.segsel{border:0;background:none;font:inherit;font-size:13px;color:var(--acc);font-weight:600;padding:6px 4px;width:auto;max-width:150px}
main{max-width:720px;margin:0 auto;padding:12px 14px 110px}
nav.bot{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.bot a{flex:1;text-align:center;color:var(--mute);text-decoration:none;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.bot a.on{color:var(--acc);font-weight:600}
nav.bot svg{width:22px;height:22px}
.badge{position:absolute;top:-3px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;line-height:16px;font-weight:600}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:14px;border:0;background:var(--acc);color:#fff;font-size:28px;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.16);z-index:6}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);background:var(--bg);z-index:41;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top)) 0 24px;box-shadow:2px 0 10px rgba(0,0,0,.14)}
.drawer .dh{padding:0 18px 10px;font-weight:700;font-size:18px}
.drawer .dp{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;font-weight:600;font-size:15px;cursor:pointer;border-top:1px solid var(--line)}
.drawer .dp em{font-style:normal;color:var(--mute);font-weight:400;font-size:13px}
.drawer .dc a{padding-left:34px}
.prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--ok)}
.drawer .dg{padding:12px 18px 4px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.drawer a{display:flex;justify-content:space-between;align-items:center;padding:11px 18px;color:var(--ink);text-decoration:none;font-size:15px}
.drawer a.on{background:var(--accs);color:var(--acc);font-weight:600}
.drawer a span{font-size:12px;color:var(--mute)}
.drawer a span.r{color:#fff;background:var(--red);border-radius:9px;padding:0 6px;line-height:18px}
h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:18px 0 8px;font-weight:600}
.pt{font-size:21px;margin:6px 0 10px;line-height:1.25}

.card.warn{background:var(--ambs);border-color:transparent}
.card.note{background:var(--accs);border-color:transparent}
.pad0{padding:0;overflow:hidden}
.ct{font-weight:600}
.meta{color:var(--mute);font-size:13px;margin-top:2px}
.tags{margin-bottom:4px}
.chip{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:6px;background:var(--accs);color:var(--acc);margin:0 4px 2px 0}

.acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}

.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}

.wide{width:100%;display:block}
.mt{margin-top:10px}
.fld{display:block;margin-bottom:10px}
.fld span{display:block;font-size:12.5px;color:var(--mute);margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}
textarea{resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.back{color:var(--acc);text-decoration:none;font-size:14px;display:inline-block;padding:4px 0}

.strike{text-decoration:line-through;color:var(--mute)}
.lrow{padding:9px 12px;border-bottom:1px solid var(--line);display:block;color:var(--ink);text-decoration:none}
.lrow:last-child{border-bottom:0}
.card .lrow{padding:8px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:14px;margin:0}
.kv dt{color:var(--mute)}
.kv dd{margin:0;word-break:break-word}
.det{margin:10px 0 0}
.stg{margin:0;padding:0;list-style:none}
.stg li{padding:4px 0;color:var(--mute);font-size:14px}
.stg li.d{color:var(--ink)}
.stg li.c{font-weight:650;color:var(--acc)}
.tl{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.cal.head div{text-align:center;font-size:11.5px;color:var(--mute)}
.cd{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:46px;padding:4px 5px;position:relative;font-size:13px}
.cd.td{border-color:var(--acc);font-weight:700}
.cd.sel{background:var(--accs)}
.cd i{position:absolute;bottom:4px;right:4px;font-style:normal;font-size:10.5px;background:var(--acc);color:#fff;border-radius:8px;padding:0 5px;line-height:15px}
.cd i.r{background:var(--red)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.stats.s4{grid-template-columns:repeat(4,1fr)}
.stats div,.stats a{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;text-decoration:none;color:var(--ink)}
.stats b{display:block;font-size:19px}
.stats span{display:block}
.dtile.full{grid-column:1/-1}
.stats span{font-size:11.5px;color:var(--mute)}
.stats .rd b{color:var(--red)}
.stats .am b{color:var(--amb)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sum{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}
.sum.tabsonly{margin-top:0;padding:4px 10px 0}.sum.tabsonly .htabs{margin-top:0;border-top:0}
.sum .top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.sum .nums{display:flex;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.htabs{display:flex;margin-top:10px;border-top:1px solid var(--line);padding-top:4px}
.htabs button{flex:1;border:0;border-bottom:2px solid transparent;background:none;font:inherit;font-size:11.5px;color:var(--mute);padding:5px 2px 6px;line-height:1.2;cursor:pointer}
.htabs button b{display:block;font-size:18px;color:var(--ink)}
.htabs button.on{border-bottom-color:var(--acc);color:var(--acc);font-weight:600}
.htabs button.rd b{color:var(--red)}.htabs button.tcal{flex:0 0 54px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:1px solid var(--line)}.htabs .tsub{display:block;font-size:10.5px;font-weight:400;color:var(--mute);margin-top:1px}.rdt{color:var(--red)}.htabs button.am b{color:var(--amb)}
.cust{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.sum .nums a{flex:1;text-align:center;text-decoration:none;color:var(--mute);font-size:11.5px;line-height:1.2}
.sum .nums a+a{border-left:1px solid var(--line)}
.sum .nums b{display:block;font-size:18px;color:var(--ink)}
.sum .nums .rd b{color:var(--red)}.sum .nums .am b{color:var(--amb)}
.list{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:8px}
.trow{display:flex;gap:10px;align-items:flex-start;padding:10px 8px 10px 12px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.subh{font-size:12px;color:var(--mute);padding:6px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--mute);background:none;flex:none;margin-top:1px;padding:0;cursor:pointer}
.tick:active{background:var(--oks);border-color:var(--ok)}
.trow .bd{flex:1;min-width:0;cursor:pointer}
.trow .tt{font-weight:550;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.trow .mt2{font-size:12.5px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .ty{color:var(--acc);font-weight:600}
.trow .due{font-size:12px;white-space:nowrap;margin-top:2px;color:var(--mute)}
.trow .due.r{color:var(--red);font-weight:600}.trow .due.a{color:var(--amb);font-weight:600}
.kebab{border:0;background:none;color:var(--mute);font-size:20px;line-height:1;padding:0 6px;cursor:pointer;flex:none}
.rtr{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
.rtr:last-child{border-bottom:0}.rtr span{flex:1}
.pill{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:999px;font:inherit;font-size:12px;padding:3px 10px;cursor:pointer}
.pill.on{background:var(--oks);border-color:transparent;color:var(--ok);font-weight:600}
.arow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.arow:last-child{border-bottom:0}.arow .an{flex:1;min-width:0}.arow .an div{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .ac{font-weight:650;font-size:16px;min-width:24px;text-align:right}.arow .chev{color:var(--mute)}
.mrow{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;color:var(--ink);padding:13px 4px;cursor:pointer}
.mrow:last-child{border-bottom:0}.mrow small{display:block;color:var(--mute);font-size:12.5px}
@media (min-width:640px){.dgrid{grid-template-columns:1fr 1fr 1fr}}
.dtile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;text-decoration:none;color:var(--ink);display:block}
.dtile .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.dtile .hd b{font-size:14.5px}
.dtile .hd em{font-style:normal;font-size:20px;font-weight:700}
.dl{font-size:12.5px;color:var(--mute);line-height:1.45}
.rd{color:var(--red)!important;font-weight:600}
.am{color:var(--amb)}
.srch{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--mute);margin-bottom:12px;text-decoration:none}
.srch svg{width:18px;height:18px;flex:none}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
details.grp{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
details.grp>summary,details.sg>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px}
details.grp>summary::-webkit-details-marker,details.sg>summary::-webkit-details-marker{display:none}
details.grp>summary{padding:12px 14px}
details.grp>summary::after,details.sg>summary::after{content:'\203A';margin-left:auto;color:var(--mute);font-size:20px;line-height:1;transform:rotate(90deg);transition:transform .15s}
details[open].grp>summary::after,details[open].sg>summary::after{transform:rotate(-90deg)}
details.sg{border-top:1px solid var(--line)}
details.sg>summary{padding:10px 14px;font-size:14px;font-weight:600;background:var(--bg)}
details.sg .arow{border-radius:0}
.gacts{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-top:1px solid var(--line)}
.h2t{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
.h2t:last-child{border-bottom:0}
.h2t>.r{flex:none;width:66px;font-variant-numeric:tabular-nums;color:var(--mute);font-size:13px;padding-top:1px}
.h2t>.b{flex:1;min-width:0}
.h2t.sec{background:var(--accs)}
.h2t.end{background:var(--bg)}
.ib{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--acc);flex:none;text-decoration:none}
.ib:active{background:var(--accs)}
.ib.sm{width:30px;height:30px;border:0;background:none}
.ib.sm svg{width:17px;height:17px}
.ibs{display:flex;gap:8px;flex:none;align-items:center}
.prow{display:flex;align-items:center;gap:10px}
.lrow.prow{display:flex}
.iwk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.iwk>div{background:var(--bg);border-radius:10px;padding:10px 12px}
.iwk b{font-size:22px;display:block;line-height:1.1}
.iwk span{font-size:12px;color:var(--mute)}
.dots{display:flex;gap:4px;margin:6px 0 4px}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--acc)}
.dots.ok i.on{background:var(--ok)}
.meta.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qlc{padding:10px 12px}
.qlt{font-weight:600;margin-bottom:8px;word-break:break-word}
.qch{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.qchip{border:1px dashed var(--mute);background:var(--card);color:var(--mute);border-radius:16px;padding:4px 11px;font:inherit;font-size:13px;min-height:34px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qchip.on{border-style:solid;border-color:var(--acc);color:var(--acc);background:var(--accs)}
.ctxb{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;margin:-4px 0 8px;background:var(--accs);border-radius:10px;padding:6px 6px 6px 12px}
.lnk{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0;font-size:14px}
.lnk .btn{margin-left:auto}
.miss{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 8px}
.fixl{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);text-decoration:none;color:var(--acc);font-size:13.5px;font-weight:600}
.sumsec summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
.sumsec summary::-webkit-details-marker{display:none}
.srow{display:grid;grid-template-columns:1.25fr .7fr 1.05fr;gap:8px;padding:9px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:13.5px;align-items:center}
.srow:first-of-type{margin-top:8px}
.srow small{display:block;color:var(--mute);font-size:12px}
.also{background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:14px}
.ck input{width:20px;height:20px;flex:none;margin:1px 0 0}
.ntout{display:grid;grid-template-columns:1.1fr .8fr 1.1fr auto;gap:6px;margin-bottom:6px}

.ntext{border-bottom:1px solid var(--line);padding:8px 0}

.pkg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-height:55vh;overflow:auto}.pkgi{border:2px solid var(--line);border-radius:10px;padding:4px;opacity:.55}.pkgi.on{border-color:var(--acc);opacity:1}.pkgi img{width:100%;height:150px;object-fit:contain;background:var(--bg);border-radius:6px;display:block;cursor:zoom-in}.pkgi .ck{font-size:12px;margin-top:4px}

.olist{margin-top:8px}
.orow{display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px;align-items:start;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}

.o1{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}.o1 span{font-size:13px}.o2{font-size:13px;color:var(--mute);margin-top:2px;overflow-wrap:anywhere}.od{padding-top:2px}

 return {v:2,offSheets:{},psMaps:{},items:[],people:[],vehicle:[],inbox:[],visits:[],canals:[],log:[],inspNotes:{},routineDone:{},routines:r,settings:{subs:{K:'My subdivision'},lastBackup:null,lastNotify:null}}}

if(!S||!Array.isArray(S.items))S=DEF();

fillDefaults();

function log(text,o){S.log.push({ts:Date.now(),date:today(),sub:o&&o.sub&&o.sub!=='B'?o.sub:'',text,id:o&&o.id&&o.type?o.id:null});if(S.log.length>6000)S.log.splice(0,S.log.length-6000)}
function prune(){const cut=addDays(today(),-200);for(const k in S.routineDone)if(k<cut)delete S.routineDone[k]}

/* ---------- file store (IndexedDB) ---------- */
let _db=null;
function idb(){return _db||(_db=new Promise((res,rej)=>{const r=indexedDB.open('sdodesk-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
function fTx(mode,fn){return idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction('files',mode);const st=tx.objectStore('files');let out;const r=fn(st);if(r)r.onsuccess=()=>{out=r.result};tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error)}))}
const fPut=rec=>fTx('readwrite',st=>st.put(rec));
const fGet=id=>fTx('readonly',st=>st.get(id));
const fAll=()=>fTx('readonly',st=>st.getAll());
const fDel=id=>fTx('readwrite',st=>st.delete(id));
const blobToB64=b=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(b)});
async function fileGC(){try{const used=new Set();S.items.forEach(it=>(it.links||[]).forEach(l=>{if(l.fileId)used.add(l.fileId)}));(S.visits||[]).forEach(v=>((v.nt||{}).photos||[]).forEach(x=>used.add(x.fid)));(S.canals||[]).forEach(c=>{[c.hPhoto,c.tPhoto].forEach(x=>{if(x)used.add(x)});(c.outlets||[]).forEach(o=>{if(o.photo)used.add(o.photo)})});const all=await fAll();for(const r of all)if(!used.has(r.id))await fDel(r.id)}catch(e){}}

/* ---------- model ---------- */
const DESIGS=['XEN','SE','Chief Engineer','SDO','Sub Engineer (SEN)','Sub Divisional Clerk (SDC)','Sub Divisional Reader (SDR)','SDR / Zilladar','Zilladar','Canal Patwari','Signaller','Mate','Mistry','Earthwork Mistry','Gauge Reader','Regular Beldar','Beldar','Artificer','Telephone Attendant','Naib Qasid','Dak Runner','Chowkidar','Chowkidar cum Cook','Cook','Sweeper','Drawing Branch','NESPAK','AAG / Law Officer','Police (SHO)','Other'];

const F=(k,l,t,o)=>({k,l,t:t||'text',o});
const PRI=['Normal','High','Low'];

const actOf=it=>it.act||(it.replyDue?(it.dir==='Received'?'Reply to write':'Awaiting their reply'):'Record only');const priRank=it=>it.priority==='High'?0:it.priority==='Low'?2:1;
const T={
 task:{n:'Follow-up',pl:'Follow-ups',daily:1,f:[F('title','Task / direction'),F('source','Source','sel',['XEN direction','Meeting','SE / Chief direction','Canal wire','Self','Other']),F('priority','Priority','sel',PRI),F('assignees','Assigned to (one or more)','people'),F('due','Deadline','date'),F('details','Details','textarea')]},
 complaint:{n:'Complaint',pl:'Complaints',daily:1,f:[F('source','Source','sel',['WRIMS (PMIU)','Ombudsman Punjab','Other']),F('refNo','Complaint No'),F('title','Subject'),F('received','Received on','date'),F('due','Reply due (WRIMS: auto 3 days if left blank)','date'),F('side','Side','sel',['Technical','Revenue']),F('owner','Report from','person'),F('details','Details','textarea')]},
 estimate:{n:'Estimate',pl:'Estimates',daily:0,f:[F('scheme','M&R or ADP','sel',['M&R Work','ADP Scheme']),F('closure','Closure work or other than closure','sel',['Closure work','Other than closure']),F('wtype','Nature of work','sel',['Desilting','Other than desilting','Building work']),F('title','Name of work (as submitted)'),F('wpName','Name in work plan (if different, e.g. full canal)'),F('canal','Canal / channel','list','canals'),F('reaches','Reaches (e.g. 0+000-12+000, 23+000-34+000)'),F('xsInt','Cross-section every','sel',['1000 ft','500 ft']),F('amount','Amount submitted (Rs)','num'),F('authority','Sanctioning authority','sel',['Auto','XEN','SE','Chief Engineer']),F('owner','Sub Engineer','person'),F('estNo','Estimate No'),F('estDate','Received from SEN on','date'),F('items','Items included','textarea'),F('due','Target date','date'),F('details','Details','textarea')]},

 court:{n:'Court case',pl:'Court cases',daily:0,f:[F('title','Case title'),F('refNo','Case No'),F('court','Court','sel',['Civil Court','Lahore High Court','Other']),F('courtName','Court / bench'),F('hearing','Next hearing','date'),F('attendTime','Attend time','time'),F('attendWhere','Attend at (e.g. AAG office)'),F('owner','Handled by','person'),F('details','Details','textarea')]},
 inquiry:{n:'Inquiry',pl:'Inquiries',daily:0,f:[F('role','Your role','sel',['Inquiry Officer','DR','Accused']),F('title','Subject / charges'),F('apptBy','Appointed by (authority)'),F('orderNo','Order No'),F('orderDate','Order date','date'),F('accusedIds','Accused (pick one or more)','people'),F('accused','Accused not in People (type names, comma separated)'),F('dr','Departmental Representative (DR)'),F('io','Inquiry Officer'),F('chargeDate','Charge sheet / show cause date','date'),F('replyDue','Reply due (when you are accused)','date'),F('hearing','Next hearing','date'),F('details','Details','textarea')]},
 wire:{n:'Canal wire',pl:'Canal wires',daily:0,f:[F('dir','Wire','sel',['Received','Issued']),F('refNo','Wire No'),F('wireDate','Date','date'),F('wireTime','Time','time'),F('party','From / To','list','parties'),F('owner','Signaller','person'),F('title','Subject'),F('action','Action','sel',['Information only','Needs action']),F('assign','Action by (received wire)','person'),F('recips','Sent to for action (issued wire, one or more)','people'),F('due','Action deadline','date'),F('details','Details','textarea')]},

 event:{n:'Event',pl:'Meetings & events',daily:0,f:[F('title','Title'),F('due','Date','date'),F('time','Time','time'),F('place','Place'),F('details','Details','textarea')]},
 resource:{n:'Resource',pl:'Resources',daily:0,f:[F('title','Title'),F('cat','Category','sel',['Department manuals','Canal details','Notifications & orders','Rules & SOPs','Proformas & forms','Sheets & data','Maps & L-sections','Police jurisdiction','Staff lists','Other']),F('details','Notes / keywords','textarea')]},
 pmiu:{n:'PMIU wire',pl:'PMIU wires',daily:0,f:[F('refNo','PMIU canal wire No'),F('wireDate','Inspection / wire date','date'),F('canal','Canal(s) visited','list','canals'),F('title','Subject (auto if blank)'),F('meetingDate','SE meeting date','date'),F('details','Notes','textarea')]},
 prep:{n:'To prepare',pl:'To prepare',daily:1,f:[F('kind','What to prepare','sel',['Letter','Report','Inspection note','Reply','Explanation','Other']),F('title','Subject'),F('dirBy','Directed by','sel',['XEN','SE','Chief Engineer','Self','Court','Other']),F('party','Addressed to','list','parties'),F('priority','Priority','sel',PRI),F('due','Deadline','date'),F('details','Points to cover / draft','textarea')]},
 template:{n:'Template',pl:'Templates',daily:0,f:[F('title','Template name'),F('cat','Category','sel',['Letter','Canal wire','Robkar / notice','Inspection note','Reply / report','Proforma','Other']),F('body','Text with blanks (optional): {canal} {rd} {date} {sen} {no} {subject} {party} {subdivision} {ps}','textarea'),F('details','Keywords','textarea')]},
 place:{n:'Place',pl:'Places',daily:0,f:[F('title','Name'),F('cat','Category','sel',['Rest house','Office (AC / DC / XEN / SE)','Police station','Head / regulator / gauge','Canal site / outlet','Court','Hospital','Other']),F('section','Irrigation section','secsel','irr'),F('zsec','Zilladari section','secsel','zil'),F('address','Address / landmark'),F('lat','Latitude'),F('lng','Longitude'),F('mapUrl','Google Maps link (optional)'),F('contact','Contact person'),F('phone','Phone','tel'),F('details','Notes','textarea')]}
};
const DEFV={pmiu:['wireDate'],complaint:['received'],estimate:['estDate'],theft:['reportedOn'],wire:['wireDate'],event:['due'],letter:['letterDate']};
const STG={
 complaint:()=>['Received','Sent to staff for report','Report received','Reply submitted'],
 estimate:it=>estSteps(it).map(x=>x.l),
 prep:()=>['To draft','Drafted','Signed','Dispatched'],
 theft:it=>{const a=['Reported by SEN','Site checked by SDO','Confirmation canal wire issued','Repair canal wire (SEN)','Repair confirmed','Zilladar directed for Fard-e-Qasran','Fard-e-Qasran received','Hearing notice issued (SDR)','Hearing held'];
  if(it.decision==='Fine')a.push('Fine imposed','Receipt issued');else if(it.decision==='Robkar / FIR')a.push('Robkar sent to SHO','FIR registered');else a.push('Decision: fine or robkar');return a}
};
const FIRST={complaint:['Received','received'],prep:['To draft','_'],theft:['Reported by SEN','reportedOn']};
const FINAL=['Reply submitted','Bill passed','Receipt issued','FIR registered','Dispatched'];
const STUCKT={complaint:2,theft:7,estimate:20};const stuckLim=it=>STUCKT[it.type]||15;const isStuck=it=>{const d=stuckDays(it);return d>0&&d>=stuckLim(it)};
const UNTOUCHED=7;
function lastAct(it){let m=it.createdAt?ymd(new Date(it.createdAt)):'';const up=d=>{if(d&&d>m)m=d};up(it.doneOn);(it.notes||[]).forEach(n=>up(ymd(new Date(n.ts))));(it.stages||[]).forEach(x=>up(x.date));return m||today()}
const untouched=it=>isOpen(it)&&!keyDate(it)&&!(it.followUp&&it.followUp>today())?diffDays(today(),lastAct(it)):0;

const subName=k=>k==='B'?'Both':(S.settings.subs[k]||k);
const inScope=x=>SUB==='A'||x.sub===SUB||x.sub==='B';
const pScope=p=>SUB==='A'||p.sub===SUB||p.sub==='B';
const SUBK=()=>Object.keys(S.settings.subs||{});const defSub=()=>SUB==='A'||!S.settings.subs[SUB]?SUBK()[0]:SUB;

const LIB=['resource','place','template'],REG={letter:'letterDate',wire:'wireDate'};
const isOpen=it=>{if(it.resolved||LIB.includes(it.type))return false;if(it.type==='wire')return asgPend(it).length>0&&!!idsOf(it.recips).length;if(it.type==='letter'){const a=actOf(it);if(a==='Awaiting their reply')return !!it.replyDue;if(a==='Reply to write')return !S.items.some(x=>x.type==='prep'&&x.rel===it.id);if(a==='Directions to act on')return !S.items.some(x=>x.type==='task'&&x.rel===it.id);return false}if(it.type==='event')return !(it.due&&it.due<today());return true};

  case 'complaint':p(it.due,'Reply due');break;
  case 'letter':{const a=actOf(it);if(a!=='Record only')p(it.replyDue,a==='Awaiting their reply'?'Reply expected':a==='Directions to act on'?'Act by':'Reply due');break}
  case 'wire':if(isOpen(it))p(wireDue(it),'Action due');break;
  case 'resource':case 'place':case 'template':break;
  case 'pmiu':p(it.meetingDate,'SE meeting');break;
  case 'event':p(it.due,'Event'+(it.time?' '+it.time:''));break;
  default:p(it.due,it.type==='estimate'?'Target':'Deadline')}
 return r}

function buckets(all){const t=today(),soon=addDays(t,2);const g={over:[],overF:[],today:[],soon:[],fu:[],later:0};
 S.items.forEach(it=>{if(!(all||inScope(it))||!isOpen(it)||it.doneOn===t||it.personal)return;const kd=keyDate(it);
  if(it.type==='event'){if(kd===t)g.today.push(it);return}
  if(kd&&kd<t){(it.followUp&&it.followUp>t?g.overF:g.over).push(it);return}
  if(it.type==='prep'&&kd!==t){g.later++;return}
  const upcoming=kd&&kd>=t&&kd<=soon;
  if(it.followUp&&it.followUp>t&&!upcoming){g.later++;return}
  if(kd&&kd<t)g.over.push(it);else if(kd===t)g.today.push(it);else if(upcoming)g.soon.push(it);
  else if(it.followUp&&it.followUp<=t)g.fu.push(it);else if(kd&&kd>soon)g.later++;else if(T[it.type].daily)g.fu.push(it);else g.later++});
 const so=(a,b)=>(priRank(a)-priRank(b))||((keyDate(a)||'9')+a.createdAt).localeCompare((keyDate(b)||'9')+b.createdAt);
 ['over','overF','today','soon','fu'].forEach(k=>g[k].sort(so));return g}

function lagging(){const t=today();return S.items.filter(it=>inScope(it)&&isOpen(it)&&it.type!=='event'&&!it.personal).map(it=>{const k=keyDate(it);const od=k&&k<t?diffDays(t,k):0;const sd=isStuck(it)?stuckDays(it):0;const ud=untouched(it);return {it,od,sd,ud:ud>=UNTOUCHED?ud:0}}).filter(x=>x.od||x.sd||x.ud).sort((a,b)=>(b.od*2+b.sd+b.ud)-(a.od*2+a.sd+a.ud))}

  else if(dow===5&&(x.n<3||x.sub<3))out.push({r:1,s,t:`Final: ${nm} ${x.n}/3 inspected, ${x.sub}/3 notes to Division. Finish before tonight.`})});return out}

async function compressImg(file,max,q){const url=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});const s=Math.min(1,(max||1280)/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',q||0.7))}finally{URL.revokeObjectURL(url)}}

/* ---------- estimates: Part 1 sanction chain, Part 2 execution and bills ---------- */
function estAuth(it){if(it.authority&&it.authority!=='Auto')return it.authority;const a=Number(it.amount)||0,r=rules();if(isBldg(it))return a<r.bldXen?'XEN':a<r.bldSe?'SE':'Chief Engineer';return a<r.canalXen?'XEN':a<r.canalSe?'SE':'Chief Engineer'}
const estNesp=it=>(Number(it.amount)||0)>=rules().nespak&&estAuth(it)!=='XEN';
function rdVal(s){const m=String(s||'').trim().match(/^(\d+)\s*\+\s*(\d{1,3})$/);if(m)return (+m[1])*1000+(+m[2]);const n=parseFloat(s);return isNaN(n)?null:Math.round(n*1000)}
const rdTxt=v=>Math.floor(v/1000)+'+'+String(v%1000).padStart(3,'0');
function reachesOf(it){return String(it.reaches||'').split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean).map(r=>{const p=r.split(/\s*(?:to|–|-)\s*/i);const a=rdVal(p[0]),b=rdVal(p[1]);return a!=null&&b!=null&&b>a?{a,b}:null}).filter(Boolean)}
const reachFt=it=>reachesOf(it).reduce((s,r)=>s+(r.b-r.a),0);
const xsCount=it=>{const ft=reachFt(it);const iv=/500/.test(it.xsInt||'')?500:1000;return ft?Math.round(ft/iv):0};
const xsRed=it=>Math.ceil(xsCount(it)*0.35);
function estSteps(it){const au=estAuth(it),ne=estNesp(it);const s=[['rcv','Received from SEN','mark'],['field','Field check by SDO','mark'],['fwd','Forwarding letter issued','letter'],['xen','Submitted to XEN office','mark'],['dhd','DHD check (Division)','check']];
 if(au==='XEN')s.push(['sanc','Sanctioned by XEN','memo']);
 else if(au==='SE'){s.push(['toSe','Forwarded by XEN to SE','letter']);if(ne)s.push(['seNes','SE forwarded to NESPAK','mark'],['nes','NESPAK vetting','check']);s.push(['circle','SE circle branch check','check'],['sanc','Sanctioned by SE','memo'])}
 else{s.push(['toSe','Forwarded by XEN to SE','letter'],['circle','SE circle branch check','check'],['toCe','Forwarded by SE to Chief','letter']);if(ne)s.push(['ceNes','Chief forwarded to NESPAK','mark'],['nes','NESPAK vetting','check']);s.push(['ceBr','Chief branch check','check'],['sanc','Sanctioned by Chief Engineer','memo'])}
 return s.map(([k,l,t])=>({k,l,t}))}
const chainOf=(it,ri)=>ri<0?it:(it.revals||[])[ri];
function chainSteps(it,ri){const base=estSteps(it);if(ri<0)return base;const i=base.findIndex(s=>s.k==='dhd');return [{k:'rq',l:'Contractor request received',t:'mark'},{k:'fwd',l:'SDO forwarded request to XEN',t:'letter'}].concat(base.slice(i).map(s=>s.k==='sanc'?{k:'sanc',l:'Revalidation approved ('+estAuth(it)+')',t:'memo'}:s))}
function curStep(it,ri){const o=chainOf(it,ri);const ch=o.ch||{};return chainSteps(it,ri).find(s=>!(ch[s.k]&&ch[s.k].date))||null}
const sancD=it=>it.ch&&it.ch.sanc&&it.ch.sanc.date;
const fyEnd=d=>{const y=+d.slice(0,4),m=+d.slice(5,7);return (m>=7?y+1:y)+'-06-30'};

/* Fixed structure: irrigation sections (per subdivision), zilladaris with patwar circles (not tied to a subdivision), canals, places.
   Only the person in charge changes, and that is set in one place: Sections & areas. */
function secNames(sub){const st=((S.settings.secList||{})[sub])||[];return [...new Set(st.concat(S.people.filter(p=>p.sub===sub&&p.section&&!/office/i.test(p.section)&&!isZil(p.section)).map(p=>p.section)))].sort((a,b)=>{const o=((S.settings.secOrder||{})[sub])||[];const i=o.indexOf(a),j=o.indexOf(b);return (i<0?999:i)-(j<0?999:j)||a.localeCompare(b)})}
function ensureAreas(){const st=S.settings;let ch=!st.zils;st.zils=st.zils||[];
 S.people.filter(p=>isZil(p.section)).forEach(p=>{let z=st.zils.find(z=>z.name.toLowerCase()===p.section.toLowerCase());if(!z){z={name:p.section,head:'',circles:[]};st.zils.push(z);ch=true}
  if(/patwari/i.test(p.designation)){const cn=(p.posting||'').trim()||tcase(secCore(p.section));if(cn&&!z.circles.some(c=>c.name.toLowerCase()===cn.toLowerCase())){z.circles.push({name:cn,head:p.id});ch=true}}});
 if(ch)save();return ch}
const zilNames=()=>(S.settings.zils||[]).map(z=>z.name);
const zilOf=n=>(S.settings.zils||[]).find(z=>z.name===n);

/* ---------- Google Earth (.kml / .kmz) import: points become places, canal lines fill canal head / tail ---------- */
async function readKml(f){let txt;if(/\.kmz$/i.test(f.name)){const z=fflate.unzipSync(new Uint8Array(await f.arrayBuffer()));const k=Object.keys(z).find(n=>/\.kml$/i.test(n));if(!k)throw new Error('no kml');txt=new TextDecoder().decode(z[k])}else txt=await f.text();
 const d=new DOMParser().parseFromString(txt,'application/xml');if(d.getElementsByTagName('parsererror').length)throw new Error('bad kml');
 const kids=(el,n)=>[...el.children].filter(c=>c.localName===n);const val=(el,n)=>{const c=kids(el,n)[0];return c?c.textContent.trim():''};
 const desc=h=>{const x=document.createElement('div');x.innerHTML=String(h||'').replace(/<br\s*\/?>/gi,'\n');return (x.textContent||'').replace(/\n{3,}/g,'\n\n').trim()};
 const all=(el,n)=>[...el.getElementsByTagName('*')].filter(c=>c.localName===n);
 const out=[];const walk=(el,path)=>{[...el.children].forEach(c=>{if(c.localName==='Folder'||c.localName==='Document'){const n=val(c,'name');walk(c,c.localName==='Folder'&&n?path.concat(n):path)}else if(c.localName==='Placemark'){
  const g=['Point','LineString','Polygon'].find(k=>all(c,k).length)||'';const co=all(c,'coordinates')[0];
  const pts=co?co.textContent.trim().split(/\s+/).map(x=>x.split(',').map(Number)).filter(a=>a.length>=2&&!isNaN(a[0])&&!isNaN(a[1])).map(a=>[a[1],a[0]]):[];
  const ext=all(c,'Data').map(x=>[x.getAttribute('name'),val(x,'value')]).concat(all(c,'SimpleData').map(x=>[x.getAttribute('name'),x.textContent.trim()])).filter(x=>x[1]).map(x=>x[0]+': '+x[1]).join('\n');
  if(pts.length)out.push({name:val(c,'name')||'(no name)',desc:[desc(val(c,'description')),ext].filter(Boolean).join('\n'),path,g,pts})}})};
 walk(d.documentElement,[]);return out}
const hav=(a,b)=>{const R=6371,r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const placeCat=t=>/rest\s*house|\br\.?\s*h\b/i.test(t)?'Rest house':/police|thana/i.test(t)?'Police station':/court/i.test(t)?'Court':/hospital|\bbhu\b|\brhc\b|dispensary/i.test(t)?'Hospital':/office|\bxen\b|\bdc\b|\bac\b|tehsil/i.test(t)?'Office (AC / DC / XEN / SE)':/head|regulator|gauge|bridge|fall|weir|escape|syphon|siphon|aqueduct|culvert|\bvrb\b|\bcr\b/i.test(t)?'Head / regulator / gauge':/outlet|mogha|\brd\b|\d+\s*\+\s*\d+/i.test(t)?'Canal site / outlet':'Other';
const isCanalName=t=>/disty|distributary|minor|canal|branch|main\s*line|feeder|\bsub\b|\b\d+\s*-?\s*[lr]\b/i.test(t);
/* head / tail pins: "Piplan Disty Head", "Tail of Joya Minor", or a pin named Head / Tail inside a canal's folder */
const cnCore=x=>String(x||'').toLowerCase().replace(/distributary|distt?y\b/g,'disty').replace(/[^a-z0-9]+/g,' ').replace(/\b(disty|minor|sub|canal|branch|feeder|main|line|the)\b/g,' ').replace(/\s+/g,' ').trim();
function canalFor(sub,nm){const full=x=>String(x||'').toLowerCase().replace(/distributary|distt?y\b/g,'disty').replace(/[^a-z0-9]+/g,'');const cs=S.canals.filter(c=>c.sub===sub);const ex=cs.filter(c=>full(c.name)===full(nm));if(ex.length)return ex[0];const k=cnCore(nm);if(!k)return null;const hit=cs.filter(c=>cnCore(c.name)===k);return hit.length===1?hit[0]:null}
function htParse(sub,name,path){const m=String(name||'').match(/\b(head|tail)\b/i);if(!m)return null;const kind=m[1].toLowerCase()==='head'?'h':'t';
 const strip=x=>String(x||'').replace(/\b(head|tail|of|at|point|pin|end)\b/ig,' ').replace(/[()\[\],:;._-]+/g,' ').replace(/\s+/g,' ').trim();
 const cands=[strip(name),String(path[path.length-1]||'').trim()].filter(x=>x&&/[a-z]{3}/i.test(x.replace(/\b(rd|km)\b/ig,'')));
 for(const c of cands){const ex=canalFor(sub,c);if(ex)return {kind,canal:ex,name:ex.name}}
 const nw=cands.find(isCanalName);return nw?{kind,canal:null,name:tcase(nw).replace(/\bDisty\b/i,'Disty')}:null}
function htApply(sub,ht,pt,sec,zsec,res){let c=ht.canal||canalFor(sub,ht.name);if(!c){c={id:uid(),sub,name:ht.name};S.canals.push(c);res.cnNew++}

 if(!c.section&&sec)c.section=sec;if(!c.zsec&&zsec)c.zsec=zsec;res.ht++;return c}
A.htMove=()=>{snap();const res={ht:0,kept:0,cnNew:0};const keep=[];S.items.forEach(it=>{if(it.type!=='place'||!inScope(it)||!it.lat){keep.push(it);return}const fm=String(it.details||'').match(/Folder: (.*)/);const ht=htParse(it.sub,it.title,fm?fm[1].split(' / '):[]);if(!ht){keep.push(it);return}htApply(it.sub,ht,[+it.lat,+it.lng],it.section,it.zsec,res)});S.items=keep;log('Moved '+res.ht+' head / tail pins to canals',{});save();render();toast(res.ht+' pins moved to canals'+(res.cnNew?', '+res.cnNew+' new canals':'')+(res.kept?', '+res.kept+' kept the GPS already saved':''),1)};
const htWaiting=()=>S.items.filter(it=>it.type==='place'&&inScope(it)&&it.lat&&htParse(it.sub,it.title,((String(it.details||'').match(/Folder: (.*)/)||[])[1]||'').split(' / ').filter(Boolean))).length;

A.kmlImp=inp=>{const f=inp.files&&inp.files[0];inp.value='';if(!f)return;toast('Reading file…');readKml(f).then(arr=>{if(!arr.length)return toast('No places found in this file');if(SUB!=='A')return kmlDo(arr,SUB);KIMP=arr;sheet(`<div class="ct">${arr.length} items found. Add to which subdivision?</div><div class="grid2 mt">${SUBK().map(k=>`<button class="btn" onclick="closeSheet();kmlDo(KIMP,'${k}')">${esc(subName(k))}</button>`).join('')}</div>`)}).catch(()=>toast('Could not read this Google Earth file'))};
function kmlDo(arr,sub){snap();const r={pl:0,dup:0,cnNew:0,cnUpd:0,sec:0,ht:0,kept:0,rv:0};
 arr.forEach(x=>{const fp=x.path.join(' ');const sec=matchSec(sub,fp,false)||matchSec(sub,x.name,false),zsec=matchSec(sub,fp,true)||matchSec(sub,x.name,true);
  const km=x.g==='LineString'?x.pts.slice(1).reduce((a,p,i)=>a+hav(x.pts[i],p),0):0;
  if(x.g==='LineString'&&isCanalName(x.name)){const nm=x.name.trim();let c=S.canals.find(c=>c.sub===sub&&c.name.toLowerCase()===nm.toLowerCase());if(!c){c={id:uid(),sub,name:nm};S.canals.push(c);r.cnNew++}else r.cnUpd++;
   const h=x.pts[0],t=x.pts[x.pts.length-1];if(!c.hLat){c.hLat=h[0].toFixed(6);c.hLng=h[1].toFixed(6)}if(!c.tLat){c.tLat=t[0].toFixed(6);c.tLng=t[1].toFixed(6)}if(!c.len)c.len=km.toFixed(2)+' km (Google Earth)';if(!c.section&&sec)c.section=sec;if(!c.zsec&&zsec)c.zsec=zsec;if(!c.route&&x.desc)c.route=x.desc;return}
  if(x.g==='Point'&&x.path.some(f=>/\briver\b/i.test(f))){const nm=x.name.trim();let c=S.canals.find(c=>c.sub===sub&&c.name.toLowerCase()===nm.toLowerCase());if(!c){c={id:uid(),sub,name:nm,kind:'river'};S.canals.push(c);r.rv++}if(!c.hLat){c.hLat=x.pts[0][0].toFixed(6);c.hLng=x.pts[0][1].toFixed(6)}if(!c.section&&sec)c.section=sec;if(!c.route&&x.desc)c.route=x.desc;return}
  if(x.g==='Point'){const ht=htParse(sub,x.name,x.path);if(ht){htApply(sub,ht,x.pts[0],sec,zsec,r);return}}
  const pt=x.g==='Polygon'?[x.pts.reduce((a,p)=>a+p[0],0)/x.pts.length,x.pts.reduce((a,p)=>a+p[1],0)/x.pts.length]:x.pts[0];
  if(S.items.some(it=>it.type==='place'&&it.title.toLowerCase()===x.name.toLowerCase()&&it.lat&&hav([+it.lat,+it.lng],pt)<0.03)){r.dup++;return}
  const det=[x.desc,x.g==='LineString'?'Line, '+km.toFixed(2)+' km, from Google Earth':x.g==='Polygon'?'Area, from Google Earth':'',x.path.length?'Folder: '+x.path.join(' / '):''].filter(Boolean).join('\n');
  S.items.push({id:uid(),type:'place',sub,createdAt:Date.now(),stages:[],notes:[],links:[],title:x.name,cat:placeCat(x.name+' '+x.path.join(' ')),section:sec,zsec,lat:pt[0].toFixed(6),lng:pt[1].toFixed(6),details:det});r.pl++;if(sec||zsec)r.sec++});
 log('Google Earth import: '+r.pl+' places, '+r.ht+' head / tail pins, '+(r.cnNew+r.cnUpd)+' canal lines',{sub});save();render();
 sheet(`<div class="ct">Google Earth import</div><div class="meta mt">${r.pl} places added to ${esc(subName(sub))}${r.sec?` (${r.sec} tagged with a section)`:''}${r.dup?` · ${r.dup} already in the app`:''}</div>${r.rv?`<div class="meta mt">${r.rv} river site${r.rv===1?'':'s'} added (pins in a River folder).</div>`:''}${r.ht?`<div class="meta mt">${r.ht} head / tail pins placed on their canals${r.kept?` (${r.kept} canal${r.kept===1?'':'s'} already had a different GPS, kept it)`:''}.</div>`:''}${r.cnNew+r.cnUpd?`<div class="meta mt">${[r.cnNew?r.cnNew+' new canal'+(r.cnNew===1?'':'s')+' created':'',r.cnUpd?r.cnUpd+' canal'+(r.cnUpd===1?'':'s')+' updated from canal lines':''].filter(Boolean).join(' · ')}.</div>`:''}<p class="meta">Check the category and section of each place; they are guessed from the names and folders in the file.</p><div class="acts"><button class="btn" onclick="closeSheet();go('#list/place')">Open Places</button>${r.cnNew+r.cnUpd+r.ht+r.rv?`<button class="btn" onclick="closeSheet();go('#canals')">Open Canals</button>`:''}<button class="btn p" onclick="closeSheet()">Done</button></div>`)}

function mergeHead(o){const t=canal(o.host);if(!t)return null;let h=headAt(t,o.rd);if(!h){h={id:uid(),rd:o.rd};(t.heads=t.heads||[]).push(h)}if(o.name&&!h.name)h.name=o.name;if(o.sec){h.sub=o.sub||t.sub;h.section=o.sec;h.ext=''}else if(!h.sub){const d=headDefOwner(t,o.rd);h.sub=d.sub;h.section=d.section;h.ext=d.ext||''}if(o.lat&&!h.lat){h.lat=o.lat;h.lng=o.lng}if(o.name||o.lat||o.canal||o.place)h.keep=1;
 if(o.canal){const c=canal(o.canal);if(c){S.canals.forEach(x=>{if(x.parent===c.id){x.parent=t.id;x.offRD=o.rd}});S.visits.forEach(v=>{if(v.canalId===c.id)v.canalId=t.id});if(c.route)h.note=[h.note,c.route].filter(Boolean).join('\n');S.canals=S.canals.filter(x=>x.id!==c.id)}}

function qlMake(R){const c=R.cid&&canal(R.cid);const base={id:uid(),createdAt:Date.now(),stages:[],notes:[],links:[],sub:R.sub||defSub(),title:R.title};
 if(c&&R.ty!=='pers'){base.canalId=c.id;base.canal=c.name}if(R.rd&&R.ty!=='pers')base.rd=R.rd;if(!c&&R.sec&&R.ty!=='pers')base.secG=R.sec.g;
 const xen=/\bxen\b/i.test(R.title);let it;
 switch(R.ty){
  case 'pers':it=Object.assign(base,{type:'task',personal:true,source:'Other',priority:'Normal',due:R.due,details:''});break;

  case 'court':it=Object.assign(base,{type:'court',court:'Civil Court',hearing:R.due||'',attendTime:R.time||'',owner:R.pid||'',refNo:R.no||''});break;
  case 'estimate':it=Object.assign(base,{type:'estimate',scheme:'M&R Work',closure:'Other than closure',wtype:'Other than desilting',amount:R.amt||'',estNo:R.no||'',estDate:today(),owner:R.pid||'',due:R.dueDef?'':R.due||''});it.ch={rcv:{date:today(),no:R.no||''}};it.stages.push({name:'Received from SEN',date:today(),note:R.no?'No '+R.no:''});break;
  default:it=Object.assign(base,{type:'task',source:xen?'XEN direction':'Self',priority:'Normal',due:R.due,details:''});if(R.pid){it.assignees=R.pid;it.owner=R.pid;it.asg=[{p:R.pid,st:'Pending'}]}}

A.qlSave=()=>{const e=$('#qlT');if(e)QL.text=e.value;const ls=qlLines();if(!ls.length)return toast('Type at least one line');const rs=ls.map(qlResolve);const mk=rs.filter(r=>r.ty!=='note'),nt=rs.filter(r=>r.ty==='note');

 save();QL={text:'',ctx:null,ov:{},inboxId:''};const n=made.length;if(n===1&&!nt.length&&!up.length)location.replace('#item/'+made[0].id);else if(!n&&up.length===1&&!nt.length)location.replace('#item/'+up[0].upd);else goBack();

A.mvSave=()=>{mvKeep();const it=get(MV.id);if(MV.rd&&rdV(MV.rd)==null)return toast('RD must look like 22+000');const before=linkTxt(it);snap();

let TF={f:'open',sec:'',q:''};
function tRows(){const t=today();const base=S.items.filter(it=>it.type==='task'&&inScope(it));let l;
 if(TF.f==='closed')l=base.filter(it=>!isOpen(it));else if(TF.f==='pers')l=base.filter(it=>it.personal&&isOpen(it));else{l=base.filter(it=>isOpen(it)&&!it.personal);if(TF.f==='over')l=l.filter(it=>{const k=keyDate(it);return k&&k<t})}
 if(TF.sec&&TF.f!=='pers')l=l.filter(it=>{const x=iSec(it);return TF.sec==='-'?!x:x&&(x.s+'|'+x.g)===TF.sec});
 const q=TF.q.toLowerCase().split(/\s+/).filter(Boolean);if(q.length)l=l.filter(it=>q.every(w=>itemText(it).includes(w)));

function lfSug(it){const tx=[it.title,it.details].filter(Boolean).join(' ');const s={};if(it.type==='task'&&PERS_RE.test(it.title)){s.pers=1;return s}const L=findLink(tx);if(L&&L.c)s.cid=L.c.id;else if(L&&L.sec)s.sec=L.sec;s.rd=findRD(tx);return s}
const lfTxt=s=>s.pers?'Personal':[s.cid&&canal(s.cid)?canal(s.cid).name+(s.rd?' · RD '+s.rd:''):'',s.cid?(x=>x?x.g:'')(linkSec(canal(s.cid),s.rd)):s.sec?s.sec.g:''].filter(Boolean).join(' · ');
function lfApply(it){const s=lfSug(it);if(s.pers){it.personal=true;return 1}if(s.cid){const c=canal(s.cid);it.canalId=c.id;if(hasF(it,'canal'))it.canal=c.name;if(s.rd&&!it.rd)it.rd=s.rd;const x=linkSec(c,it.rd);if(x&&it.sub!=='B')it.sub=x.s;return 1}if(s.sec){it.secG=s.sec.g;if(it.sub!=='B')it.sub=s.sec.s;return 1}return 0}
function vLinkfix(){const rows=unlinked().map(it=>({it,s:lfSug(it)}));const sug=rows.filter(r=>r.s.pers||r.s.cid||r.s.sec);
 return `<h1 class="pt">Link records</h1><p class="meta" style="margin-top:-4px">${rows.length} open record${rows.length===1?'':'s'} with no canal, section or section staff, or that look personal. Suggestions come from the title; check each before applying.</p>${sug.length>1?`<button class="btn p wide" onclick="A.lfAll()">Apply all ${sug.length} suggestions</button>`:''}${rows.map(({it,s})=>{const tx=lfTxt(s);return `<div class="card"><div class="tags"><span class="chip g">${T[it.type].n}</span>${it.owner?`<span class="chip">${esc(pShort(it.owner))}</span>`:''}</div><div class="ct" onclick="go('#item/${it.id}')" style="cursor:pointer">${esc(it.title)}</div><div class="meta">${tx?'Suggested: <b>'+esc(tx)+'</b>':'No suggestion'}</div><div class="acts">${tx?`<button class="btn s p" onclick="A.lfOne('${it.id}')">Apply</button>`:''}<button class="btn s" onclick="A.mv('${it.id}')">Choose…</button><button class="btn s" onclick="A.lfSkip('${it.id}')">No link needed</button></div></div>`}).join('')||'<p class="empty">Everything is linked.</p>'}`}
A.lfOne=id=>{snap();if(lfApply(get(id))){save();render();toast('Linked',1)}};
A.lfAll=()=>{snap();let n=0;unlinked().forEach(it=>{n+=lfApply(it)});save();render();toast('Linked '+n,1)};
A.lfSkip=id=>{snap();get(id).lnSkip=1;save();render();toast('Left unlinked',1)};

 v.nt={tpl:'sen',title:chTitle(c)||v.canalName||'',outs:[],aq:c&&c.q?String(c.q):'',oq:'',at:'tail',on:{out:1,tail:1,staff:1,reg:1,gen:1},txt:{},ext,photos:[],cc:h?h.name+', Sub Engineer, '+sec.g:'Sub Engineer concerned'};return v.nt}
const NTH=[[/gauge|guage/i,'Gauge'],[/berm/i,'Berm'],[/outlet|mogha|moga/i,'Outlets'],[/silt|desilt/i,'Silting'],[/breach|bank/i,'Banks'],[/culvert|bridge|parapet/i,'Culverts and parapets'],[/theft|tamper|illegal/i,'Water theft'],[/weed|sarkanda|narki|grass/i,'Weeds'],[/tail/i,'Tail'],[/road|crossing/i,'Road crossing'],[/encroach/i,'Encroachment'],[/discharge|cusec|\bcs\b/i,'Discharge']];
const ntHead=t=>(NTH.find(([re])=>re.test(t))||[0,'Site observation'])[1];
const ntSent=t=>{t=t.trim().replace(/\s+/g,' ');t=t.charAt(0).toUpperCase()+t.slice(1);return /[.!?]$/.test(t)?t:t+'.'};
function ntChannel(v){return (v.nt&&v.nt.title)||canalLabel(v)}
function ntDisSent(nt,where){if(nt.at!==where||!nt.oq)return '';return 'Authorized discharge at '+(where==='tail'?'tail':'head')+(nt.aq?' is '+nt.aq+' Cs':'')+'; discharge observed at the time of inspection was '+nt.oq+' Cs.'}
function ntRows(v){const nt=ntInit(v);const ch=ntChannel(v);const n=nt.outs.length;const R=[];
 NT_ROWS.forEach(r=>{if(!nt.on[r.k])return;if(r.k==='out'&&!n)return;const custom=nt.txt[r.k];const ps=(custom?custom.split('\n'):ntStdP(r)).map(p=>p.trim()).filter(Boolean).flatMap(p=>p==='@out_first'?[ntOutFirst(nt)]:p==='@outlets'?['@outlets']:p==='@dis_tail'?[ntDisSent(nt,'tail')]:p==='@dis_head'?[ntDisSent(nt,'head')]:[p.replace(/\{ch\}/g,ch)]).filter(Boolean);
  R.push({h:r.h.replace('{n}',String(n).padStart(2,'0')),ps})});
 nt.ext.filter(e=>e.t.trim()).forEach(e=>R.push({h:e.h||'Site observation',ps:e.t.split('\n').map(x=>x.trim()).filter(Boolean).concat(e.ref&&e.rdt&&!e.okRow?[ntRepSent(e)]:[])}));return R}
function ntOrder(v){const nt=ntInit(v);const ch=ntChannel(v);return nt.order||('Inspection of '+ch+(nt.tpl==='xen'?' along with the Executive Engineer':'')+' on '+dotD(v.date))}

function ntTableHTML(v){const nt=ntInit(v);const rows=ntRows(v);const td=(x,w)=>`<td style="${TB}${w?';width:'+w:''}">${x}</td>`;
 const outT=`<p style="margin:4px 0 2px;font-weight:bold;font-family:'Times New Roman',serif">Outlet-wise Details</p><table style="border-collapse:collapse;width:100%">`+`<tr>${['Outlet No.','Type','Design Data (Dia. / B × Y × H)'].map(x=>`<td style="${TB};font-weight:bold;background:#f2f2f2">${x}</td>`).join('')}</tr>`+nt.outs.map(o=>`<tr>${td(esc(o.no))}${td(esc(o.type))}${td(esc(o.des))}</tr>`).join('')+`</table>`;
 return `<table style="border-collapse:collapse;width:100%"><tr>${['Sr No.','Name Of Channel','Observation'].map((x,i)=>`<td style="${TB};font-weight:bold;background:#f2f2f2;${i===0?'width:8%':i===1?'width:24%':''}">${x}</td>`).join('')}</tr>${rows.map((r,i)=>`<tr>${td(String(i+1),'8%')}${td(esc(r.h),'24%')}${td(r.ps.map(p=>p==='@outlets'?outT:`<p style="margin:0 0 4px;font-family:'Times New Roman',serif;font-size:12pt">${esc(p)}</p>`).join(''))}</tr>`).join('')}</table>`}

let NTV=null,NTE=null;
function vNote(id){const v=S.visits.find(x=>x.id===id);if(!v)return '<p class="empty">Inspection not found.</p>';const nt=ntInit(v);NTV=id;const c=canal(v.canalId);setTimeout(hydrateImgs,0);
 const cos=(c&&c.outlets||[]).slice().sort((a,b)=>(rdV(a.rd)??0)-(rdV(b.rd)??0));
 const tog=(k,l)=>`<label class="ck"><input type="checkbox" ${nt.on[k]?'checked':''} onchange="A.ntOn('${k}',this.checked)"> ${esc(l)}</label>`;
 return `<a class="back" href="javascript:goBack()">‹ Back</a><h1 class="pt">Inspection note</h1><div class="meta" style="margin-top:-6px">${esc(canalLabel(v))} · ${fmtD(v.date)} · ${esc(subName(v.sub))}</div>
 <div class="seg mt"><button class="${nt.tpl==='sen'?'on':''}" onclick="A.ntSet('tpl','sen')">With SEN</button><button class="${nt.tpl==='xen'?'on':''}" onclick="A.ntSet('tpl','xen')">With SEN and XEN</button></div>
 <div class="card"><label class="fld"><span>Office From</span><textarea rows="4" onchange="A.ntOff('${v.sub}',this.value)">${esc(offFrom(v.sub))}</textarea></label>

 <div class="acts">${cos.length?`<button class="btn s p" onclick="A.ntPick()">Pick from ${esc(c.name)} outlets (${cos.length})</button>`:''}<button class="btn s" onclick="A.ntOutAdd('')">+ Type one</button></div><datalist id="olTypes"><option value="PIPE"><option value="APM"><option value="OFRB"><option value="Open Flume"></datalist></div>
 <h2>Discharge</h2><div class="card"><div class="grid2"><label class="fld"><span>Authorized (Cs)</span><input inputmode="decimal" value="${esc(nt.aq)}" onchange="A.ntSet('aq',this.value.trim())"></label><label class="fld"><span>Observed (Cs)</span><input inputmode="decimal" value="${esc(nt.oq)}" onchange="A.ntSet('oq',this.value.trim())"></label></div><div class="fchips"><button class="${nt.at==='tail'?'on':''}" onclick="A.ntSet('at','tail')">At tail</button><button class="${nt.at==='head'?'on':''}" onclick="A.ntSet('at','head')">At head</button></div><div class="meta">Left out of the note if Observed is empty.</div></div>
 <h2>Rows in the note</h2><div class="card">${tog('out','1 · Outlets')}${tog('tail','2 · Tail')}${tog('staff','3 · Attendance and deployment of field staff')}${tog('reg','4 · Register and records')}${tog('gen','5 · General maintenance and supervision')}<div class="meta">Untick anything you did not check, so the note never says it was checked. <a href="#" onclick="A.ntWord();return false">Change the wording of a row</a></div></div>
 <h2>Added for this visit (${nt.ext.length})</h2><div class="card">${nt.ext.map((e,i)=>`<div class="ntext"><input value="${esc(e.h)}" placeholder="Heading" onchange="A.ntExt(${i},'h',this.value)"><textarea rows="2" onchange="A.ntExt(${i},'t',this.value)">${esc(e.t)}</textarea>${e.ref&&e.rdt?`<div class="meta" style="color:var(--amb)">${e.okRow?'Rectified: point from '+dotD(e.rdt):'Repeat, pointed out '+ordN(e.n||2)+' time. Reference to note of '+dotD(e.rdt)+' is added by itself.'}</div>`:''}<div class="row" style="gap:8px;flex-wrap:wrap"><label class="ck" style="margin:0"><input type="checkbox" ${e.trk?'checked':''} onchange="A.ntTrk(${i},this.checked)"> Track until rectified</label><button class="btn s" onclick="A.ntLibSave(${i})">Save for reuse</button><button class="btn s d" style="margin-left:auto" onclick="A.ntExtDel(${i})">Remove</button></div></div>`).join('')||'<div class="meta">Lines you wrote in the inspection remarks appear here as extra rows.</div>'}<div class="acts"><button class="btn s" onclick="A.ntExtAdd()">+ Add a row</button>${(S.settings.ntLib||[]).length?`<button class="btn s" onclick="A.ntLib()">+ From saved rows (${S.settings.ntLib.length})</button>`:''}</div><div class="meta">Tracked points come back the next time you inspect this channel, so you can mark them rectified or not.</div></div>
 <h2>CC</h2><div class="card"><input value="${esc(nt.cc)}" onchange="A.ntSet('cc',this.value.trim())"></div>
 <h2>Photos (${nt.photos.length})</h2><div class="card"><label class="fld"><span>Title for photos PDF</span><input value="${esc(nt.ptitle||ntPTitle(v))}" onchange="A.ntPT(this.value)"></label><div class="ntph">${nt.photos.map((p,i)=>`<div><img data-fid="${p.fid}" alt="" onclick="A.ntView(this.src)"><div class="row" style="gap:6px"><span class="meta">${i+1}</span>${i?`<button class="btn s" onclick="A.ntPhMv(${i},-1)" aria-label="Move earlier">↑</button>`:''}${i<nt.photos.length-1?`<button class="btn s" onclick="A.ntPhMv(${i},1)" aria-label="Move later">↓</button>`:''}<button class="btn s d" style="margin-left:auto" onclick="A.ntPhDel(${i})">Remove</button></div></div>`).join('')}</div>${nt.photos.length?'<div class="meta mt">Tap a photo to see it full size. Order here is the order in the PDF.</div>':''}<label class="btn p s mt">+ Choose from gallery<input type="file" accept="image/*" multiple hidden onchange="A.ntPick2(this)"></label></div>
 <h2>Preview</h2><div class="card ntpv"><div style="white-space:pre-line;text-align:center;font-weight:bold;font-family:'Times New Roman',serif">${esc(offFrom(v.sub))}</div><p style="text-align:center;font-weight:bold;text-decoration:underline;font-family:'Times New Roman',serif">${esc(ntOrder(v))}</p><div id="ntTbl" style="overflow-x:auto">${ntTableHTML(v)}</div><p style="font-family:'Times New Roman',serif;margin-top:10px"><b>CC:</b> ${esc(nt.cc)}</p></div>
 <button class="btn p wide mt" onclick="A.ntBoth()">Share Word file${nt.photos.length?' + Photos PDF':''}</button><div class="meta" style="margin-top:4px">${esc(ntFile(v,'Inspection Note'))}.docx${nt.photos.length?'<br>'+esc(ntFile(v,'Inspection Photos Annexure-A'))+'.pdf':''}</div><div class="ntbar"><button class="btn" onclick="A.ntCopy('off')">Copy Office From</button><button class="btn" onclick="A.ntCopy('order')">Copy Order Text</button><button class="btn" onclick="A.ntCopy('tbl')">Copy table</button><button class="btn" onclick="A.ntDocx()">Word only</button><button class="btn" onclick="A.ntPdf()" ${nt.photos.length?'':'disabled'}>PDF only</button></div>
 ${v.noteSt==='Submitted'?`<div class="card mt row between"><b style="color:var(--ok)">✓ Uploaded on eFOES</b><button class="btn s" onclick="A.ntSt('Drafted')">Undo</button></div>`:`<button class="btn p wide mt" onclick="A.ntSt('Submitted')">Done: uploaded on eFOES</button>`}`}
const ntV=()=>S.visits.find(x=>x.id===NTV);
const ordN=n=>n+(n%100>=11&&n%100<=13?'th':['th','st','nd','rd'][n%10]||'th');
const ntStdP=r=>{const t=(S.settings.ntStd||{})[r.k];return t?t.split('\n'):r.p};
A.ntWordStd=()=>{const v=ntV();snap();S.settings.ntStd=S.settings.ntStd||{};NT_ROWS.forEach(r=>{const t=$('#ntw_'+r.k).value.trim();if(!t||t===r.p.join('\n'))delete S.settings.ntStd[r.k];else S.settings.ntStd[r.k]=t;delete v.nt.txt[r.k]});save();closeSheet();render();toast('Saved as your standard wording for all notes',1)};
/* outlet check history: every note that listed it, plus a verify mark */
function oChecks(c,o,exV){if(!c)return [];const L=[];S.visits.forEach(v=>{if(v.canalId!==c.id||!v.nt||v.id===exV)return;const x=(v.nt.outs||[]).find(y=>y.oid===o.id);if(x)L.push({d:v.date,bad:!!x.bad})});if(o.stD&&['ok','bad'].includes(o.st)&&!L.some(x=>x.d===o.stD)&&!(exV&&(S.visits.find(v=>v.id===exV)||{}).date===o.stD))L.push({d:o.stD,bad:o.st==='bad'});return L.sort((a,b)=>a.d.localeCompare(b.d))}
const oChkTxt=L=>{if(!L.length)return '<span style="color:var(--amb)">Never checked</span>';const last=L[L.length-1];const b=L.filter(x=>x.bad);return 'Checked '+L.length+'× · last '+fmtD(last.d)+(b.length?` · <span style="color:var(--amb)">not as per design ${b.length}× (last ${fmtD(b[b.length-1].d)})</span>`:'')};
/* tracked points: carried to the next inspection of the same channel */
function ntPrevPts(v){if(!v.canalId)return [];const iv=S.visits.indexOf(v);const dec={};S.visits.forEach(x=>{if(x.id!==v.id&&x.nt&&x.nt.prev)Object.entries(x.nt.prev).forEach(([k,st])=>{if(st!=='skip')dec[k]=1})});const out=[];
 S.visits.forEach((w,iw)=>{if(w.canalId!==v.canalId||w.id===v.id||!w.nt)return;if(w.date>v.date||(w.date===v.date&&iw>iv))return;(w.nt.ext||[]).forEach(e=>{if(e.trk&&e.id&&String(e.t||'').trim()&&!dec[e.id])out.push({w,e})})});return out.sort((a,b)=>a.w.date.localeCompare(b.w.date))}
function ntPrevCard(v){const L=ntPrevPts(v);if(!L.length)return '';const pv=v.nt.prev||{};
 return `<h2>Earlier points on this channel (${L.length})</h2><div class="card">${L.map(({w,e})=>{const st=pv[e.id];return `<div class="prv"><div class="meta">${dotD(w.date)} · ${esc(e.h||'Site observation')}${(e.n||1)>1?' · pointed out '+ordN(e.n)+' time':''}</div><div style="margin:2px 0 6px">${esc(e.t)}</div><div class="fchips">${[['ok','Rectified'],['rep','Not rectified'],['skip','Not checked']].map(([k,l])=>`<button class="${st===k?'on':''}" onclick="A.ntPrev('${e.id}','${k}')">${l}</button>`).join('')}</div></div>`}).join('')}<div class="meta">Rectified and Not rectified add a row to this note with a reference to the earlier note. Not checked keeps it open for next time.</div></div>`}
function ntFindPt(id){for(const w of S.visits){const e=w.nt&&(w.nt.ext||[]).find(x=>x.id===id);if(e)return {w,e}}return null}
A.ntPrev=(id,st)=>{const v=ntV();const f=ntFindPt(id);if(!f)return;snap();v.nt.prev=v.nt.prev||{};const was=v.nt.prev[id];v.nt.ext=v.nt.ext.filter(e=>e.ref!==id);delete v.nt.prev[id];
 if(was!==st){v.nt.prev[id]=st;const p=f.e;const rdt=p.rdt||f.w.date;
  if(st==='rep')v.nt.ext.push({id:uid(),h:p.h,t:p.t,trk:1,ref:id,rdt,n:(p.n||1)+1});
  if(st==='ok')v.nt.ext.push({id:uid(),h:p.h,t:'The point regarding “'+String(p.t).replace(/\.$/,'')+'”, raised vide inspection note dated '+dotD(f.w.date)+', was found rectified at the time of this inspection.',ref:id,rdt:f.w.date,okRow:1})}
 ntSave()};
