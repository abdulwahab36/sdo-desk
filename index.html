<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5c63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>SDO Desk</title>
<style>
:root{--bg:#f3f4f1;--card:#fcfcfa;--ink:#1c2321;--mute:#66706c;--line:#dde1dc;--acc:#0f5c63;--accs:#e2efef;--red:#b3261e;--reds:#fbe9e7;--amb:#9a6400;--ambs:#fdf3dc;--ok:#2e7d32;--oks:#e6f2e6}
@media (prefers-color-scheme:dark){:root{--bg:#111514;--card:#1b201f;--ink:#e7ebe9;--mute:#97a19d;--line:#2c3331;--acc:#5fb3b9;--accs:#1d3335;--red:#ef8a80;--reds:#3a2120;--amb:#e7b45a;--ambs:#352a15;--ok:#7fc683;--oks:#1d2e1e}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
header h1{font-size:17px;margin:0;font-weight:650;white-space:nowrap;flex:1}
.ham{border:0;background:none;color:var(--ink);padding:6px;margin-left:-4px;display:flex}
.ham svg{width:24px;height:24px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px;flex:none}
.seg button{border:0;background:none;color:var(--mute);padding:6px 9px;border-radius:6px;font:inherit;font-size:13px}
.seg button.on{background:var(--acc);color:#fff}
.segsel{border:0;background:none;font:inherit;font-size:13px;color:var(--acc);font-weight:600;padding:6px 4px;width:auto;max-width:150px}
main{max-width:720px;margin:0 auto;padding:12px 14px 110px}
nav.bot{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.bot a{flex:1;text-align:center;color:var(--mute);text-decoration:none;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.bot a.on{color:var(--acc);font-weight:600}
nav.bot svg{width:22px;height:22px}
.badge{position:absolute;top:-3px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;line-height:16px;font-weight:600}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:14px;border:0;background:var(--acc);color:#fff;font-size:28px;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.16);z-index:6}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);background:var(--bg);z-index:41;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top)) 0 24px;box-shadow:2px 0 10px rgba(0,0,0,.14)}
.drawer .dh{padding:0 18px 10px;font-weight:700;font-size:18px}
.drawer .dp{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;font-weight:600;font-size:15px;cursor:pointer;border-top:1px solid var(--line)}
.drawer .dp em{font-style:normal;color:var(--mute);font-weight:400;font-size:13px}
.drawer .dc a{padding-left:34px}
.prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--ok)}
.drawer .dg{padding:12px 18px 4px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.drawer a{display:flex;justify-content:space-between;align-items:center;padding:11px 18px;color:var(--ink);text-decoration:none;font-size:15px}
.drawer a.on{background:var(--accs);color:var(--acc);font-weight:600}
.drawer a span{font-size:12px;color:var(--mute)}
.drawer a span.r{color:#fff;background:var(--red);border-radius:9px;padding:0 6px;line-height:18px}
h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:18px 0 8px;font-weight:600}
.pt{font-size:21px;margin:6px 0 10px;line-height:1.25}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px}
.card.warn{background:var(--ambs);border-color:transparent}
.card.note{background:var(--accs);border-color:transparent}
.pad0{padding:0;overflow:hidden}
.ct{font-weight:600}
.meta{color:var(--mute);font-size:13px;margin-top:2px}
.tags{margin-bottom:4px}
.chip{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:6px;background:var(--accs);color:var(--acc);margin:0 4px 2px 0}
.chip.r{background:var(--reds);color:var(--red)}
.chip.a{background:var(--ambs);color:var(--amb)}
.chip.g{background:var(--oks);color:var(--ok)}
.acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;text-decoration:none;display:inline-block;text-align:center;cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.d{color:var(--red)}
.btn.s{padding:6px 10px;font-size:13px}
.wide{width:100%;display:block}
.mt{margin-top:10px}
.fld{display:block;margin-bottom:10px}
.fld span{display:block;font-size:12.5px;color:var(--mute);margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}
textarea{resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.back{color:var(--acc);text-decoration:none;font-size:14px;display:inline-block;padding:4px 0}
.chk{display:flex;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk input{width:20px;height:20px;flex:none;margin:0}
.strike{text-decoration:line-through;color:var(--mute)}
.lrow{padding:9px 12px;border-bottom:1px solid var(--line);display:block;color:var(--ink);text-decoration:none}
.lrow:last-child{border-bottom:0}
.card .lrow{padding:8px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:14px;margin:0}
.kv dt{color:var(--mute)}
.kv dd{margin:0;word-break:break-word}
.det{margin:10px 0 0}
.stg{margin:0;padding:0;list-style:none}
.stg li{padding:4px 0;color:var(--mute);font-size:14px}
.stg li.d{color:var(--ink)}
.stg li.c{font-weight:650;color:var(--acc)}
.tl{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.cal.head div{text-align:center;font-size:11.5px;color:var(--mute)}
.cd{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:46px;padding:4px 5px;position:relative;font-size:13px}
.cd.td{border-color:var(--acc);font-weight:700}
.cd.sel{background:var(--accs)}
.cd i{position:absolute;bottom:4px;right:4px;font-style:normal;font-size:10.5px;background:var(--acc);color:#fff;border-radius:8px;padding:0 5px;line-height:15px}
.cd i.r{background:var(--red)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.stats.s4{grid-template-columns:repeat(4,1fr)}
.stats div,.stats a{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;text-decoration:none;color:var(--ink)}
.stats b{display:block;font-size:19px}
.stats span{display:block}
.dtile.full{grid-column:1/-1}
.stats span{font-size:11.5px;color:var(--mute)}
.stats .rd b{color:var(--red)}
.stats .am b{color:var(--amb)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sum{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}
.sum.tabsonly{margin-top:0;padding:4px 10px 0}.sum.tabsonly .htabs{margin-top:0;border-top:0}
.sum .top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.sum .nums{display:flex;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.htabs{display:flex;margin-top:10px;border-top:1px solid var(--line);padding-top:4px}
.htabs button{flex:1;border:0;border-bottom:2px solid transparent;background:none;font:inherit;font-size:11.5px;color:var(--mute);padding:5px 2px 6px;line-height:1.2;cursor:pointer}
.htabs button b{display:block;font-size:18px;color:var(--ink)}
.htabs button.on{border-bottom-color:var(--acc);color:var(--acc);font-weight:600}
.htabs button.rd b{color:var(--red)}.htabs button.tcal{flex:0 0 54px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:1px solid var(--line)}.htabs .tsub{display:block;font-size:10.5px;font-weight:400;color:var(--mute);margin-top:1px}.rdt{color:var(--red)}.htabs button.am b{color:var(--amb)}
.cust{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.sum .nums a{flex:1;text-align:center;text-decoration:none;color:var(--mute);font-size:11.5px;line-height:1.2}
.sum .nums a+a{border-left:1px solid var(--line)}
.sum .nums b{display:block;font-size:18px;color:var(--ink)}
.sum .nums .rd b{color:var(--red)}.sum .nums .am b{color:var(--amb)}
.list{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:8px}
.trow{display:flex;gap:10px;align-items:flex-start;padding:10px 8px 10px 12px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.subh{font-size:12px;color:var(--mute);padding:6px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--mute);background:none;flex:none;margin-top:1px;padding:0;cursor:pointer}
.tick:active{background:var(--oks);border-color:var(--ok)}
.trow .bd{flex:1;min-width:0;cursor:pointer}
.trow .tt{font-weight:550;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.trow .mt2{font-size:12.5px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .ty{color:var(--acc);font-weight:600}
.trow .due{font-size:12px;white-space:nowrap;margin-top:2px;color:var(--mute)}
.trow .due.r{color:var(--red);font-weight:600}.trow .due.a{color:var(--amb);font-weight:600}
.kebab{border:0;background:none;color:var(--mute);font-size:20px;line-height:1;padding:0 6px;cursor:pointer;flex:none}
.rtr{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
.rtr:last-child{border-bottom:0}.rtr span{flex:1}
.pill{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:999px;font:inherit;font-size:12px;padding:3px 10px;cursor:pointer}
.pill.on{background:var(--oks);border-color:transparent;color:var(--ok);font-weight:600}
.arow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.arow:last-child{border-bottom:0}.arow .an{flex:1;min-width:0}.arow .an div{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .ac{font-weight:650;font-size:16px;min-width:24px;text-align:right}.arow .chev{color:var(--mute)}
.mrow{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;color:var(--ink);padding:13px 4px;cursor:pointer}
.mrow:last-child{border-bottom:0}.mrow small{display:block;color:var(--mute);font-size:12.5px}
@media (min-width:640px){.dgrid{grid-template-columns:1fr 1fr 1fr}}
.dtile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;text-decoration:none;color:var(--ink);display:block}
.dtile .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.dtile .hd b{font-size:14.5px}
.dtile .hd em{font-style:normal;font-size:20px;font-weight:700}
.dl{font-size:12.5px;color:var(--mute);line-height:1.45}
.rd{color:var(--red)!important;font-weight:600}
.am{color:var(--amb)}
.srch{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--mute);margin-bottom:12px;text-decoration:none}
.srch svg{width:18px;height:18px;flex:none}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.fchips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:5px 11px;font:inherit;font-size:13px}
.fchips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.center{text-align:center}
img[data-fid]:not([src]){display:block;height:120px;background:var(--line)}
.empty{color:var(--mute);text-align:center;padding:22px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));background:#222;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:92vw}
#toast.on{opacity:1;pointer-events:auto}
#toast button{background:none;border:0;color:#7fd3d9;font:inherit;font-weight:700;margin-left:10px;padding:0}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:40}
.sheetbox{position:fixed;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;background:var(--bg);border-radius:14px 14px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));z-index:41;max-width:720px;margin:0 auto}
a{color:var(--acc)}
.hello .big{font-size:20px;font-weight:650}
</style>
</head>
<body>
<header><button class="ham" onclick="openDrawer()" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><h1 onclick="go('#home')" style="cursor:pointer">SDO Desk</h1><button class="ham" id="homeBtn" style="margin-right:auto;align-items:center;gap:6px;font:inherit;font-weight:600;color:var(--acc)" onclick="go('#home')" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</button><button class="ham" onclick="go('#search')" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button><div class="seg" id="seg"></div></header>
<main id="main"></main>
<button class="fab" onclick="A.fab()" aria-label="Add">+</button>
<div id="toast"></div>
<datalist id="desigs"></datalist>
<script src="fflate.js"></script>
<script>
'use strict';
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/864e5);
const fmtD=s=>{if(!s)return '';const d=new Date(s+'T00:00:00');if(isNaN(d))return s;const o={day:'2-digit',month:'short'};if(d.getFullYear()!==new Date().getFullYear())o.year='numeric';return d.toLocaleDateString('en-GB',o)};
const fmtTs=ts=>new Date(ts).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const rel=s=>{const n=diffDays(s,today());return n<0?(-n)+'d overdue':n===0?'today':n===1?'tomorrow':'in '+n+' days'};
const num=x=>{const n=Number(x);return isNaN(n)?String(x):(Math.round(n*10)/10).toLocaleString('en-PK')};
const go=h=>{location.hash=h.replace(/^#/,'')};
const isUrl=u=>/^https?:\/\//i.test(u||'');
const wa=ph=>{let d=String(ph||'').replace(/\D/g,'');if(d.startsWith('0'))d='92'+d.slice(1);return d};
const fsize=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';

/* ================= data ================= */
const KEY='sdodesk.v1';
function DEF(){const r=[];['K','I'].forEach(s=>['Check gauge proforma','Check eFOES','Check SEN activity on WhatsApp group'].forEach(t=>r.push({id:uid(),sub:s,title:t})));
 return {v:2,offSheets:{},psMaps:{},items:[],people:[],vehicle:[],inbox:[],visits:[],canals:[],log:[],inspNotes:{},routineDone:{},routines:r,settings:{subs:{K:'Kundian',I:'Isakhel'},lastBackup:null,lastNotify:null}}}
let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.items))S=DEF();
function fillDefaults(){const d=DEF();for(const k in d)if(S[k]===undefined)S[k]=d[k];if(!S.settings.subs)S.settings.subs=d.settings.subs}
fillDefaults();
let SUB='A';try{SUB=localStorage.getItem('sdodesk.sub')||'A'}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save. Storage blocked or full.')}clearTimeout(save._a);save._a=setTimeout(()=>{try{pushAlarmState()}catch(e){}},1500)}
let UNDO=null;
function snap(){UNDO=JSON.stringify(S)}
function undo(){if(!UNDO)return;S=JSON.parse(UNDO);UNDO=null;save();render();toast('Undone')}
function log(text,o){S.log.push({ts:Date.now(),date:today(),sub:o&&o.sub&&o.sub!=='B'?o.sub:'',text,id:o&&o.id&&o.type?o.id:null});if(S.log.length>6000)S.log.splice(0,S.log.length-6000)}
function prune(){const cut=addDays(today(),-200);for(const k in S.routineDone)if(k<cut)delete S.routineDone[k]}

/* ---------- file store (IndexedDB) ---------- */
let _db=null;
function idb(){return _db||(_db=new Promise((res,rej)=>{const r=indexedDB.open('sdodesk-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
function fTx(mode,fn){return idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction('files',mode);const st=tx.objectStore('files');let out;const r=fn(st);if(r)r.onsuccess=()=>{out=r.result};tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error)}))}
const fPut=rec=>fTx('readwrite',st=>st.put(rec));
const fGet=id=>fTx('readonly',st=>st.get(id));
const fAll=()=>fTx('readonly',st=>st.getAll());
const fDel=id=>fTx('readwrite',st=>st.delete(id));
const blobToB64=b=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(b)});
async function fileGC(){try{const used=new Set();S.items.forEach(it=>(it.links||[]).forEach(l=>{if(l.fileId)used.add(l.fileId)}));(S.canals||[]).forEach(c=>{[c.hPhoto,c.tPhoto].forEach(x=>{if(x)used.add(x)});(c.outlets||[]).forEach(o=>{if(o.photo)used.add(o.photo)})});const all=await fAll();for(const r of all)if(!used.has(r.id))await fDel(r.id)}catch(e){}}

/* ---------- model ---------- */
const DESIGS=['XEN','SE','Chief Engineer','SDO','Sub Engineer (SEN)','Sub Divisional Clerk (SDC)','Sub Divisional Reader (SDR)','SDR / Zilladar','Zilladar','Canal Patwari','Signaller','Mate','Mistry','Earthwork Mistry','Gauge Reader','Regular Beldar','Beldar','Artificer','Telephone Attendant','Naib Qasid','Dak Runner','Chowkidar','Chowkidar cum Cook','Cook','Sweeper','Drawing Branch','NESPAK','AAG / Law Officer','Police (SHO)','Other'];
const dIdx=p=>{const i=DESIGS.indexOf(p.designation);return i<0?99:i};
const F=(k,l,t,o)=>({k,l,t:t||'text',o});
const PRI=['Normal','High','Low'];
const LACTS=['Record only','Reply to write','Directions to act on','Awaiting their reply'];

function buckets(all){const t=today(),soon=addDays(t,2);const g={over:[],overF:[],today:[],soon:[],fu:[],later:0};
 S.items.forEach(it=>{if(!(all||inScope(it))||!isOpen(it)||it.doneOn===t)return;const kd=keyDate(it);
  if(it.type==='event'){if(kd===t)g.today.push(it);return}
  if(kd&&kd<t){(it.followUp&&it.followUp>t?g.overF:g.over).push(it);return}
  if(it.type==='prep'&&kd!==t){g.later++;return}
  const upcoming=kd&&kd>=t&&kd<=soon;
  if(it.followUp&&it.followUp>t&&!upcoming){g.later++;return}
  if(kd&&kd<t)g.over.push(it);else if(kd===t)g.today.push(it);else if(upcoming)g.soon.push(it);
  else if(it.followUp&&it.followUp<=t)g.fu.push(it);else if(kd&&kd>soon)g.later++;else if(T[it.type].daily)g.fu.push(it);else g.later++});
 const so=(a,b)=>(priRank(a)-priRank(b))||((keyDate(a)||'9')+a.createdAt).localeCompare((keyDate(b)||'9')+b.createdAt);
 ['over','overF','today','soon','fu'].forEach(k=>g[k].sort(so));return g}
const counts=all=>{const g=buckets(all);return {over:g.over.length,today:g.today.length}};
function lagging(){const t=today();return S.items.filter(it=>inScope(it)&&isOpen(it)&&it.type!=='event').map(it=>{const k=keyDate(it);const od=k&&k<t?diffDays(t,k):0;const sd=isStuck(it)?stuckDays(it):0;const ud=untouched(it);return {it,od,sd,ud:ud>=UNTOUCHED?ud:0}}).filter(x=>x.od||x.sd||x.ud).sort((a,b)=>(b.od*2+b.sd+b.ud)-(a.od*2+a.sd+a.ud))}
function weekStart(t){const d=new Date(t+'T00:00:00');return addDays(t,-((d.getDay()+6)%7))}

function pmMatch(it,r){const a=offA(it.sub);if(!a)return {st:'nosheet'};const pd=it.wireDate;

 const before=cands.filter(x=>x.d.senCwDate&&pd&&x.d.senCwDate<=pd&&diffDays(pd,x.d.senCwDate)<=45).sort((p,q)=>q.d.senCwDate.localeCompare(p.d.senCwDate));
 if(before.length)return {st:'covered',row:before[0],days:diffDays(pd,before[0].d.senCwDate)};
 const after=cands.filter(x=>x.d.senCwDate&&pd&&x.d.senCwDate>pd&&diffDays(x.d.senCwDate,pd)<=30).sort((p,q)=>p.d.senCwDate.localeCompare(q.d.senCwDate));
 if(after.length)return {st:'late',row:after[0],days:diffDays(after[0].d.senCwDate,pd)};
 if(byNo.length)return {st:'listed',row:byNo[0]};
 return {st:'none'}}
function pmChecks(x){if(!x)return '';const c=(ok,l)=>`<span class="chip ${ok?'g':'r'}">${ok?'✓':'✗'} ${l}</span>`;
 return c(!!x.o.sdoCwNo||!!x.d.sdoCwDate,'SDO confirmation')+(x.o.senRepNo||x.o.sdoRepNo?c(!!x.o.sdoRepNo,'repair confirmed'):'')+c(x.robkar||x.fine,x.robkar?'robkar':x.fine?'fine':'fine / robkar')+(x.robkar?c(x.fir,'FIR'):'')+c(x.tawanDone,'tawan decision')}

 const ready=res.filter(x=>x.m.row&&x.m.st==='covered'&&!/✗/.test(pmChecks(x.m.row))).length;const noSheet=!offA(it.sub);

 if(rows.length)h+=`<div class="card note"><b>${cov} covered by SEN beforehand · ${late?`<span class="rd">${late} SEN miss / not in sheet</span>`:'0 missed'} · ${ready}/${rows.length} reply-ready</b>${noSheet?'<div class="meta">Import the offence sheet to check coverage.</div>':''}</div>`;
 h+=res.map(({r,m},i)=>{const st={covered:`<span class="chip g">Covered · SEN C.W ${esc(m.row&&m.row.o.senCwNo)} on ${fmtD(m.row&&m.row.d.senCwDate)} (${m.days}d before)</span>`,late:`<span class="chip r">SEN miss · reported ${m.days}d after PMIU</span>`,listed:'<span class="chip a">In sheet under this PMIU wire, SEN date unclear</span>',none:'<span class="chip r">Not in offence sheet</span>',nosheet:'<span class="chip">Sheet not imported</span>'}[m.st];

/* ================= reminders ================= */
async function notify(title,body){try{const r=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(r)await r.showNotification(title,{body,icon:'icon-192.png',badge:'icon-192.png'});else new Notification(title,{body})}catch(e){}}
async function dailyNotify(){if(!('Notification' in window)||Notification.permission!=='granted'||S.settings.bgRem===false)return;const t=today();if(S.settings.lastNotify===t||await notifiedToday())return;const c=counts(true);const ia=inspAlarms();const evs=S.items.filter(it=>!it.resolved&&((it.type==='event'&&it.due===t)||(it.type==='court'&&it.hearing===t)));const ibn=S.inbox.length;S.settings.lastNotify=t;save();if(c.over||c.today||ia.length||evs.length||ibn){notify('SDO Desk',[c.over||c.today?c.over+' overdue, '+c.today+' due today':'',ibn?ibn+' quick note'+(ibn>1?'s':'')+' to sort':'',...ia.map(a=>a.t),...evs.map(x=>'Today: '+(x.time||x.attendTime?(x.time||x.attendTime)+' ':'')+x.title)].filter(Boolean).join(' · '));markNotified()}}
function checkSoon(){if(!('Notification' in window)||Notification.permission!=='granted')return;const t=today(),now=new Date();let ch=false;
 S.items.forEach(it=>{if(!isOpen(it))return;let d=null,tm=null,l='';if(it.type==='court'){d=it.hearing;tm=it.attendTime;l='Court'}else if(it.type==='event'){d=it.due;tm=it.time;l='Event'}
  if(d!==t||!tm||it._nt===t)return;const hm=tm.split(':').map(Number);const mins=hm[0]*60+hm[1]-(now.getHours()*60+now.getMinutes());
  if(mins>0&&mins<=120){it._nt=t;ch=true;notify(l+' at '+tm,it.title+(it.attendWhere?' · '+it.attendWhere:it.place?' · '+it.place:''))}});if(ch)save()}

/* ================= v12: follow-ups, wires, to-prepare, inspections, canals, estimates, inquiries ================= */
const RULES_DEF={canalXen:600000,canalSe:3000000,bldXen:150000,bldSe:300000,nespak:1000000,explN:2};
const rules=()=>Object.assign({},RULES_DEF,S.settings.rules||{});
const rs=n=>{const v=Number(n);if(n===''||n==null||isNaN(v))return '';return 'Rs '+Math.round(v).toLocaleString('en-IN')};
const lac=n=>{const v=Number(n);if(!v||isNaN(v))return '';return (Math.round(v/1000)/100).toString()+' lac'};
const rsL=n=>rs(n)?rs(n)+(Number(n)>=100000?' ('+lac(n)+')':''):'';
const fmtDot=d=>d?d.slice(8,10)+'.'+d.slice(5,7)+'.'+d.slice(0,4):'-';
const idsOf=s=>String(s||'').split(',').map(x=>x.trim()).filter(Boolean);
const REASONS=['SEN report not received','Awaiting XEN / office reply','Field visit pending','Waiting on another department','Contractor delay'];

/* ---------- several people per task / wire ---------- */
function asgOf(it){if(it.asg&&it.asg.length)return it.asg;const ids=idsOf(it.type==='wire'?it.recips:it.assignees);if(ids.length)return ids.map(p=>({p,st:'Pending'}));if(it.type==='task'&&it.owner)return [{p:it.owner,st:'Pending'}];return []}
const asgPend=it=>asgOf(it).filter(a=>a.st==='Pending');
function asgLine(it){const l=asgOf(it);if(!l.length)return pShort(it.owner);if(l.length===1)return pShort(l[0].p);const pn=asgPend(it);return pn.length?pn.length+' of '+l.length+' pending: '+pn.map(a=>pShort(a.p)||'?').join(', '):'all '+l.length+' submitted'}
let PPM=null;
A.pickPeople=fid=>{PPM={fid,sel:new Set(idsOf($('#'+fid).value))};sheet(`<div class="ct">Choose one or more</div><input id="pmq" type="search" class="mt" placeholder="Search name, designation, section" oninput="$('#pmr').innerHTML=pmList()"><div id="pmr" class="mt">${pmList()}</div><div class="card mt"><div class="ct">Not in the list? Add</div><div class="grid2 mt"><input id="ppn" placeholder="Name"><input id="ppd" list="desigs" placeholder="Designation"></div><div class="acts"><button class="btn" onclick="A.pmNew()">Add</button></div></div><button class="btn p wide mt" onclick="A.pmDone()">Done</button>`)};
function pmList(){const e=$('#pmq');const q=(e?e.value:'').toLowerCase().split(/\s+/).filter(Boolean);
 if(!S.people.length)return '<p class="meta">No people saved yet. Add one below.</p>';
 const l=S.people.filter(p=>!q.length||q.every(w=>[p.name,p.designation,p.section,p.posting].join(' ').toLowerCase().includes(w))).sort((a,b)=>(pScope(b)-pScope(a))||dIdx(a)-dIdx(b)||a.name.localeCompare(b.name)).slice(0,80);
 return `<div class="list">${l.map(p=>`<label class="chk"><input type="checkbox" ${PPM.sel.has(p.id)?'checked':''} onchange="A.pmTog('${p.id}',this.checked)"><span><b style="font-weight:600">${esc(p.name)}</b> <span class="meta">${esc([p.designation,p.section].filter(Boolean).join(' · '))}</span></span></label>`).join('')||'<p class="empty">No match.</p>'}</div>`}
A.pmTog=(id,on)=>{if(on)PPM.sel.add(id);else PPM.sel.delete(id)};
A.pmNew=()=>{const n=$('#ppn').value.trim();if(!n)return toast('Enter a name');const p={id:uid(),name:n,designation:$('#ppd').value.trim()||'Other',sub:defSub(),section:'',posting:'',phone:'',cnic:'',notes:''};S.people.push(p);log('Added person: '+n,{sub:p.sub});save();PPM.sel.add(p.id);$('#ppn').value='';$('#ppd').value='';$('#pmr').innerHTML=pmList();toast('Added '+n)};
A.pmDone=()=>{const ids=[...PPM.sel];const f=$('#'+PPM.fid),b=$('#'+PPM.fid+'_b');if(f)f.value=ids.join(',');if(b)b.innerHTML=ids.length?ids.map(i=>esc(pShort(i))).join(', '):'<span class="meta">Tap to choose one or more…</span>';closeSheet()};
A.asgSet=(id,i,s)=>{const it=get(id);snap();it.asg=asgOf(it).map(x=>Object.assign({},x));const a=it.asg[i];a.st=a.st===s?'Pending':s;
 if(a.st==='Submitted'){a.d=today();const due=it.type==='wire'?wireDue(it):it.due;a.late=!!(due&&a.d>due)}else{delete a.d;delete a.late}
 log((a.st==='Pending'?'Marked pending: ':a.st==='Submitted'?'Submitted: ':'Not required: ')+pShort(a.p)+' · '+it.title,it);save();render();
 if(!asgPend(it).length)toast('Everyone has submitted. Resolve when satisfied.',1);else toast('Updated',1)};
function asgBlock(it){const l=asgOf(it);if(!l.length||(it.type==='wire'&&!idsOf(it.recips).length&&!it.asg))return '';const pn=asgPend(it);
 return `<h2>${it.type==='wire'?'Recipients':'Assigned to'} (${l.length-pn.length} of ${l.length} done)</h2><div class="list">${l.map((a,i)=>{const p=person(a.p);return `<div class="rtr"><span>${esc(p?p.name:'?')}<br><span class="meta">${esc(p?p.designation:'')}${a.st==='Submitted'&&a.d?' · submitted '+fmtD(a.d)+(a.late?' (late)':''):''}</span></span><button class="pill ${a.st==='Submitted'?'on':''}" onclick="A.asgSet('${it.id}',${i},'Submitted')">${a.st==='Submitted'?'✓ ':''}Submitted</button><button class="pill ${a.st==='NR'?'on':''}" onclick="A.asgSet('${it.id}',${i},'NR')">N/A</button></div>`}).join('')}</div>`+(it.type==='wire'?wireRemBlock(it):'')+(!pn.length&&isOpen(it)?`<div class="card note">Everyone has submitted. <button class="btn s p" onclick="A.resolve('${it.id}')">Resolve</button></div>`:'')}

/* ---------- canal wire reminders and explanation ---------- */
const wireDue=it=>{const r=it.rems||[];return r.length?r[r.length-1].due:it.due};
function wireRemBlock(it){const r=it.rems||[];const pn=asgPend(it);let h='';
 if(r.length)h+=`<div class="list">${r.map((x,i)=>`<div class="arow"><span class="an"><b style="font-weight:600">Reminder ${i+1}</b><div>No ${esc(x.no||'-')} · ${fmtD(x.date)} · due ${fmtD(x.due)}</div><div>To: ${x.to.map(p=>esc(pShort(p))).join(', ')}</div></span></div>`).join('')}</div>`;
 if(pn.length&&!it.resolved){h+=`<div class="acts"><button class="btn p" onclick="A.wireRem('${it.id}')">Issue reminder wire to ${pn.length} pending</button></div>`;
  const wd=wireDue(it);if(r.length>=rules().explN&&wd&&wd<today())h+=`<div class="card warn mt"><div class="ct">${pn.length} still pending after ${r.length} reminders</div><div class="meta">Call explanation. The draft quotes every previous reference.</div><div class="acts">${pn.map(a=>`<button class="btn s p" onclick="A.explain('${it.id}','${a.p}')">Explanation: ${esc(pShort(a.p))}</button>`).join('')}</div></div>`}
 return h}
A.wireRem=id=>{const it=get(id);const t=today();sheet(`<div class="ct">Reminder wire ${(it.rems||[]).length+1}</div><div class="meta">To: ${asgPend(it).map(a=>esc(pShort(a.p))).join(', ')}</div><div class="grid2 mt"><label class="fld"><span>Wire No</span><input id="rwN"></label><label class="fld"><span>Date</span><input type="date" id="rwD" value="${t}"></label></div><label class="fld"><span>New deadline</span><input type="date" id="rwU" value="${addDays(t,2)}"></label><button class="btn p wide" onclick="A.wireRemSave('${id}')">Save reminder</button>`)};
A.wireRemSave=id=>{const it=get(id);const u=$('#rwU').value;if(!u)return toast('Set the new deadline');snap();it.asg=asgOf(it).map(x=>Object.assign({},x));const to=asgPend(it).map(a=>a.p);(it.rems=it.rems||[]).push({no:$('#rwN').value.trim(),date:$('#rwD').value||today(),due:u,to});it.followUp=null;log('Reminder wire '+it.rems.length+' issued: '+it.title,it);save();closeSheet();render();toast('Reminder '+it.rems.length+' saved',1)};
A.explain=(id,pid)=>{const it=get(id);const p=person(pid);const refs=[`Canal wire No ${it.refNo||'-'} dated ${fmtDot(it.wireDate)}`].concat((it.rems||[]).map(x=>`reminder canal wire No ${x.no||'-'} dated ${fmtDot(x.date)}`));
 const body=`To\n${p?p.name+', '+p.designation:''}\n\nSubject: CALLING EXPLANATION REGARDING ${it.title.toUpperCase()}\n\nReference: ${refs.join('; ')}.\n\nVide above references you were directed to ${it.title}${it.due?' by '+fmtDot(it.due):''}. The same has not been received in this office till date despite ${(it.rems||[]).length} reminders.\n\nYou are hereby directed to explain your position in writing within three days of receipt of this letter.\n\nSub Divisional Officer\n${subName(it.sub)} Sub Division`;
 snap();const pr={id:uid(),type:'prep',createdAt:Date.now(),stages:[{name:'To draft',date:today(),note:''}],notes:[],links:[],sub:it.sub,kind:'Explanation',title:'Explanation: '+(p?p.name:'')+' · '+it.title,dirBy:'Self',party:p?p.name+(p.designation?', '+p.designation:''):'',priority:'High',due:addDays(today(),1),details:body,rel:it.id};S.items.push(pr);log('Added to prepare: '+pr.title,pr);save();go('#item/'+pr.id);toast('Explanation draft created',1)};

/* ---------- follow-up history with reasons ---------- */
function fuLine(it){const n=(it.fus||[]).length;return n?n+' follow-up'+(n>1?'s':''):''}
function fuBlock(it){const f=it.fus||[];if(!f.length)return '';return `<h2>Follow-ups (${f.length})</h2><div class="list">${f.slice().reverse().map(x=>`<div class="arow"><span class="an"><b style="font-weight:600">${fmtD(x.d)}</b>${x.next?' → next '+fmtD(x.next):''}${x.reason?`<div class="rd" style="font-weight:500">Reason: ${esc(x.reason)}</div>`:''}${x.text?`<div>${esc(x.text)}</div>`:''}</span></div>`).join('')}</div>`}

/* ---------- to prepare ---------- */
function dispatchPrep(it,no,date){const L={id:uid(),type:'letter',createdAt:Date.now(),stages:[],notes:[],links:[],sub:it.sub,dir:'Issued',letterNo:no,letterDate:date,party:it.party||'',title:it.title,details:(it.kind||'')+' dispatched',rel:it.rel||''};S.items.push(L);
 it.resolved=true;it.resolvedOn=today();const src=it.rel&&get(it.rel);if(src&&src.type==='letter'&&!src.resolved){src.resolved=true;src.resolvedOn=today()}log('Dispatched: '+it.title+(no?' (No '+no+')':''),it);return L}

/* ---------- inspections: one note per inspection, due Saturday ---------- */
const noteSub=(v,ws)=>v.noteSt==='Submitted'||!!S.inspNotes[v.sub+'|'+(ws||weekStart(v.date))];
const isRoutineV=v=>!v.kind||v.kind==='Routine';const VKN={Routine:'Routine inspection',Estimate:'Estimate check',Other:'Site visit'};
function inspStat(s,ws){const vis=S.visits.filter(v=>v.sub===s&&v.date>=ws&&v.date<=addDays(ws,6)&&isRoutineV(v));return {n:vis.length,sub:vis.filter(v=>noteSub(v,ws)).length,vis}}
function inspAlarms(){const t=today(),ws=weekStart(t),dow=(new Date(t+'T00:00:00').getDay()+6)%7;const out=[];
 scopeSubs().forEach(s=>{const x=inspStat(s,ws);const nm=subName(s);
  if(dow===2&&x.n===0)out.push({r:0,s,t:`${nm}: no inspection yet this week. 3 needed by Friday.`});
  else if(dow===3&&x.n<2)out.push({r:0,s,t:`${nm}: only ${x.n} of 3 inspected. Notes due Friday.`});
  else if(dow===4&&(x.n<3||x.sub<3))out.push({r:1,s,t:x.n<3?`${nm}: only ${x.n} of 3 inspected. Today is the target day.`:`${nm}: ${x.sub} of 3 notes submitted. Submit today.`});
  else if(dow===5&&(x.n<3||x.sub<3))out.push({r:1,s,t:`Final: ${nm} ${x.n}/3 inspected, ${x.sub}/3 notes to Division. Finish before tonight.`})});return out}
function inspHome(){const t=today(),ws=weekStart(t);const al={};inspAlarms().forEach(a=>al[a.s]=a);const st=scopeSubs().map(s=>[s,inspStat(s,ws)]);
 if(st.every(([s,x])=>x.n>=3&&x.sub>=3))return `<h2>This week's inspections</h2><a class="arow list" href="#insp"><span class="an">All done · 3/3 inspected and notes submitted</span><span class="ac" style="color:var(--acc)">✓</span><span class="chev">›</span></a>`;
 const fri=addDays(ws,4),sat=addDays(ws,5);const when=t<fri?'target Fri '+fmtD(fri):t===fri?'target today':t===sat?'<span class="rd">final day today</span>':'';
 return `<h2>This week's inspections${when?' · <span style="text-transform:none;letter-spacing:0">'+when+'</span>':''}</h2><div class="list">${st.map(([s,x])=>{const ok=x.n>=3&&x.sub>=3;const a=al[s];return `<a class="arow" href="#insp"><span class="an" style="display:flex;justify-content:space-between;gap:8px"><b style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(subName(s))}</b><span style="font-size:13px;white-space:nowrap;${ok?'color:var(--acc)':a?(a.r?'color:var(--red);font-weight:600':'color:var(--amb);font-weight:600'):'color:var(--mute)'}">${ok?'✓ done':x.n+'/3 inspected · '+x.sub+'/3 notes'}</span></span><span class="chev">›</span></a>`}).join('')}</div>`}
const NOTE_ST=['Not written','Drafted','Signed','Submitted'];
A.noteSt=(vid)=>{const v=S.visits.find(x=>x.id===vid);sheet(`<div class="ct">Inspection note: ${esc(canalLabel(v))}</div><div class="meta">${fmtD(v.date)}</div><label class="fld mt"><span>Status</span><select id="nsS">${NOTE_ST.map(s=>`<option ${(v.noteSt||'Not written')===s?'selected':''}>${s}</option>`).join('')}</select></label><div class="grid2"><label class="fld"><span>Letter No (when submitted)</span><input id="nsN" value="${esc(v.noteNo||'')}"></label><label class="fld"><span>Date</span><input type="date" id="nsD" value="${v.noteDate||today()}"></label></div><button class="btn p wide" onclick="A.noteStSave('${vid}')">Save</button>`)};
A.noteStSave=vid=>{const v=S.visits.find(x=>x.id===vid);snap();v.noteSt=$('#nsS').value;v.noteNo=$('#nsN').value.trim();v.noteDate=v.noteSt==='Submitted'?($('#nsD').value||today()):'';log('Inspection note '+v.noteSt.toLowerCase()+': '+canalLabel(v)+(v.noteNo?' (No '+v.noteNo+')':''),{sub:v.sub});save();closeSheet();render();toast('Saved',1)};

/* ---------- canal profiles ---------- */
async function compressImg(file,max,q){const url=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});const s=Math.min(1,(max||1280)/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',q||0.7))}finally{URL.revokeObjectURL(url)}}
async function savePhoto(file){const b=await compressImg(file);const id=uid();await fPut({id,name:'photo-'+id+'.jpg',type:'image/jpeg',size:b.size,blob:b,ts:Date.now(),text:''});return id}
function hydrateImgs(){document.querySelectorAll('img[data-fid]').forEach(async im=>{if(im.src)return;try{const r=await fGet(im.dataset.fid);if(r)im.src=URL.createObjectURL(r.blob)}catch(e){}})}
const gpsLink=(la,ln)=>la&&ln?`<a href="https://www.google.com/maps/search/?api=1&query=${esc(la)},${esc(ln)}" target="_blank" rel="noopener">${esc(la)}, ${esc(ln)}</a>`:'';
const canal=id=>S.canals.find(c=>c.id===id);
const COND=[['sarkanda','Sarkanda',['None','Light','Heavy']],['narki','Narki',['None','Light','Heavy']],['berm','Berm formation',['No','Yes']],['infill','In-filling',['No','Yes']],['incut','In-cutting',['No','Yes']]];
function vCanals(){return `<h1 class="pt">Canals</h1><p class="meta">Route, condition, outlets and photos for each canal. Add canals here or on the Inspections page.</p>`+scopeSubs().map(s=>{const cs=S.canals.filter(c=>c.sub===s);return `<h2>${esc(subName(s))} (${cs.length})</h2><div class="list">${cs.map(c=>{const last=S.visits.filter(v=>v.canalId===c.id).map(v=>v.date).sort().pop();return `<a class="arow" href="#canal/${c.id}"><span class="an"><b style="font-weight:600">${esc(c.name)}</b><div>${(c.outlets||[]).length} outlets · ${last?'inspected '+fmtD(last):'never inspected'}</div></span><span class="chev">›</span></a>`}).join('')||'<div class="arow meta">No canals yet.</div>'}</div><div class="row"><input id="cn_${s}" placeholder="Add canal / distributary / minor"><button class="btn" onclick="A.cnAdd('${s}')">Add</button></div>`}).join('')}
function vCanal(id){const c=canal(id);if(!c)return '<p class="empty">Canal not found.</p>';setTimeout(hydrateImgs,0);const cd=(c.conds||[]).slice(-1)[0];const vis=S.visits.filter(v=>v.canalId===id).sort((a,b)=>b.date.localeCompare(a.date));
 const ph=(k,l)=>`<div style="flex:1;text-align:center"><div class="meta">${l}</div>${c[k]?`<img data-fid="${c[k]}" style="width:100%;max-height:160px;object-fit:cover;border-radius:8px;margin-top:4px">`:'<div class="meta" style="padding:20px 0">No photo</div>'}<label class="btn s mt">${c[k]?'Replace':'Add'} photo<input type="file" accept="image/*" hidden onchange="A.cnPhoto('${id}','${k}',this)"></label></div>`;
 return `<h1 class="pt">${esc(c.name)}</h1><div class="meta">${esc(subName(c.sub))}</div>
 <h2>Route and landmarks</h2><div class="card">${c.route?`<p style="margin:0;white-space:pre-wrap">${esc(c.route)}</p>`:'<div class="meta">Road taken, landmarks, villages on the way, things to remember.</div>'}<dl class="kv mt">${c.hLat?`<dt>Head GPS</dt><dd>${gpsLink(c.hLat,c.hLng)}</dd>`:''}${c.tLat?`<dt>Tail GPS</dt><dd>${gpsLink(c.tLat,c.tLng)}</dd>`:''}${c.len?`<dt>Length</dt><dd>${esc(c.len)}</dd>`:''}</dl><button class="btn s mt" onclick="A.cnEdit('${id}')">Edit route / GPS</button></div>
 <h2>Head and tail photos</h2><div class="card"><div class="row" style="gap:10px;align-items:flex-start">${ph('hPhoto','Head')}${ph('tPhoto','Tail')}</div></div>
 <h2>Current condition</h2><div class="card">${cd?`<div class="meta">Checked ${fmtD(cd.date)}</div><dl class="kv mt">${COND.map(([k,l])=>`<dt>${l}</dt><dd class="${['Heavy','Yes'].includes(cd[k])?'rd':''}">${esc(cd[k]||'-')}</dd>`).join('')}</dl>${cd.remarks?`<p class="det">${esc(cd.remarks)}</p>`:''}`:'<div class="meta">Not recorded yet.</div>'}<button class="btn s mt" onclick="A.cnCond('${id}')">Record condition</button>${(c.conds||[]).length>1?`<details class="mt"><summary class="meta">Earlier (${c.conds.length-1})</summary>${c.conds.slice(0,-1).reverse().map(x=>`<div class="meta mt">${fmtD(x.date)}: ${COND.map(([k,l])=>l+' '+(x[k]||'-')).join(' · ')}${x.remarks?' · '+esc(x.remarks):''}</div>`).join('')}</details>`:''}</div>
 <h2>Outlets (${(c.outlets||[]).length})</h2><div class="list">${(c.outlets||[]).slice().sort((a,b)=>(normRD(a.rd).v||0)-(normRD(b.rd).v||0)).map(o=>`<div class="arow" onclick="A.olEdit('${id}','${o.id}')" style="cursor:pointer"><span class="an"><b style="font-weight:600">RD ${esc(o.rd||'-')} ${esc(o.side||'')}</b><div>${[o.type,o.size].filter(Boolean).map(esc).join(' · ')}${o.lat?' · GPS':''}${o.photo?' · photo':''}</div></span><span class="chev">›</span></div>`).join('')||'<div class="arow meta">No outlets recorded.</div>'}</div><button class="btn s" onclick="A.olEdit('${id}','')">+ Add outlet</button>
 <h2>Inspections (${vis.length})</h2><div class="list">${vis.slice(0,10).map(v=>`<a class="arow" href="#editvisit/${v.id}"><span class="an"><b style="font-weight:600">${fmtD(v.date)}</b><div>${isRoutineV(v)?esc(v.noteSt||'Not written'):esc(VKN[v.kind]||v.kind)}${v.remarks?' · '+esc(v.remarks):''}</div></span><span class="chev">›</span></a>`).join('')||'<div class="arow meta">None yet.</div>'}</div>`}

/* ---------- estimates: Part 1 sanction chain, Part 2 execution and bills ---------- */
function estAuth(it){if(it.authority&&it.authority!=='Auto')return it.authority;const a=Number(it.amount)||0,r=rules();if(isBldg(it))return a<r.bldXen?'XEN':a<r.bldSe?'SE':'Chief Engineer';return a<r.canalXen?'XEN':a<r.canalSe?'SE':'Chief Engineer'}
const estNesp=it=>(Number(it.amount)||0)>=rules().nespak&&estAuth(it)!=='XEN';
function rdVal(s){const m=String(s||'').trim().match(/^(\d+)\s*\+\s*(\d{1,3})$/);if(m)return (+m[1])*1000+(+m[2]);const n=parseFloat(s);return isNaN(n)?null:Math.round(n*1000)}
const rdTxt=v=>Math.floor(v/1000)+'+'+String(v%1000).padStart(3,'0');
function reachesOf(it){return String(it.reaches||'').split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean).map(r=>{const p=r.split(/\s*(?:to|–|-)\s*/i);const a=rdVal(p[0]),b=rdVal(p[1]);return a!=null&&b!=null&&b>a?{a,b}:null}).filter(Boolean)}
const reachFt=it=>reachesOf(it).reduce((s,r)=>s+(r.b-r.a),0);
const xsCount=it=>{const ft=reachFt(it);const iv=/500/.test(it.xsInt||'')?500:1000;return ft?Math.round(ft/iv):0};
const xsRed=it=>Math.ceil(xsCount(it)*0.35);
function estSteps(it){const au=estAuth(it),ne=estNesp(it);const s=[['rcv','Received from SEN','mark'],['field','Field check by SDO','mark'],['fwd','Forwarding letter issued','letter'],['xen','Submitted to XEN office','mark'],['dhd','DHD check (Division)','check']];
 if(au==='XEN')s.push(['sanc','Sanctioned by XEN','memo']);
 else if(au==='SE'){s.push(['toSe','Forwarded by XEN to SE','letter']);if(ne)s.push(['seNes','SE forwarded to NESPAK','mark'],['nes','NESPAK vetting','check']);s.push(['circle','SE circle branch check','check'],['sanc','Sanctioned by SE','memo'])}
 else{s.push(['toSe','Forwarded by XEN to SE','letter'],['circle','SE circle branch check','check'],['toCe','Forwarded by SE to Chief','letter']);if(ne)s.push(['ceNes','Chief forwarded to NESPAK','mark'],['nes','NESPAK vetting','check']);s.push(['ceBr','Chief branch check','check'],['sanc','Sanctioned by Chief Engineer','memo'])}
 return s.map(([k,l,t])=>({k,l,t}))}
const chainOf=(it,ri)=>ri<0?it:(it.revals||[])[ri];
function chainSteps(it,ri){const base=estSteps(it);if(ri<0)return base;const i=base.findIndex(s=>s.k==='dhd');return [{k:'rq',l:'Contractor request received',t:'mark'},{k:'fwd',l:'SDO forwarded request to XEN',t:'letter'}].concat(base.slice(i).map(s=>s.k==='sanc'?{k:'sanc',l:'Revalidation approved ('+estAuth(it)+')',t:'memo'}:s))}
function curStep(it,ri){const o=chainOf(it,ri);const ch=o.ch||{};return chainSteps(it,ri).find(s=>!(ch[s.k]&&ch[s.k].date))||null}
const sancD=it=>it.ch&&it.ch.sanc&&it.ch.sanc.date;
const fyEnd=d=>{const y=+d.slice(0,4),m=+d.slice(5,7);return (m>=7?y+1:y)+'-06-30'};
const fyTxt=d=>{const e=+fyEnd(d).slice(0,4);return 'FY '+(e-1)+'-'+String(e).slice(2)};
function validTill(it){const s=sancD(it);if(!s)return null;let b=s;(it.revals||[]).forEach(r=>{const a=r.ch&&r.ch.sanc&&r.ch.sanc.date;if(a&&a>b)b=a});return fyEnd(b)}
const revalOpen=it=>(it.revals||[]).find(r=>!(r.ch&&r.ch.sanc&&r.ch.sanc.date));
function revalNeed(it){const v=validTill(it);if(!v||it.resolved)return false;if((it.bills||[]).some(b=>!b.paidD&&b.subD&&b.subD>v))return true;return today()>v&&!it.compD}
function estStatus(it){if(!sancD(it)){const c=curStep(it,-1);return c?c.l:''}const ro=revalOpen(it);if(ro){const c=curStep(it,(it.revals||[]).indexOf(ro));return 'Revalidation: '+(c?c.l:'')}if(revalNeed(it))return 'Revalidation required';if(it.compD)return 'Work completed';if((it.bills||[]).length)return (it.bills.length)+' bill(s)';if(it.acc&&it.acc.no)return 'Acceptance issued';return 'Sanctioned'}
const bookOf=it=>it.nature==='Pacca'?'field book':it.nature||it.wtype==='Desilting'?'level book':'level / field book';const BookOf=it=>{const b=bookOf(it);return b[0].toUpperCase()+b.slice(1)};
function estAtt(it){return ['Forwarding letter','Necessity report','Abstract of qty & amount','Detail of X-sections (RD-wise area)',...(!isBldg(it)?['Detail of berm / sarkanda / desilting']:[]),'X-section drawings',BookOf(it)+' (first page)','Check '+bookOf(it)+' (first page)']}
function estSig(it){const x=xsCount(it);return ['Forwarding letter','Necessity report','Abstract','Last page of X-section details (area)','Blue: every X-section drawing page',`Red: ${x?xsRed(it)+' of '+x+' cross-sections (35%)':'35% of cross-sections'}`,'End page of '+bookOf(it)]}
function estRcv(it){return ['Abstract of qty & cost','X-section calculation detail','X-section drawings',BookOf(it)]}
function chkList(it,pre,arr){const c=it.chk||{};const n=arr.filter(x=>c[pre+x]).length;return {n,all:arr.length,html:`<div class="list">${arr.map(x=>`<label class="chk"><input type="checkbox" ${c[pre+x]?'checked':''} onchange="A.estChk('${it.id}','${esc(pre+x).replace(/'/g,'&#39;')}',this.checked)"><span class="${c[pre+x]?'strike':''}">${esc(x)}</span></label>`).join('')}</div>`}}
A.estChk=(id,k,on)=>{const it=get(id);it.chk=it.chk||{};if(on)it.chk[k]=true;else delete it.chk[k];save();render()};
function chainHTML(it,ri){const o=chainOf(it,ri);const ch=o.ch||{};const st=chainSteps(it,ri);const cur=curStep(it,ri);const obj=o.obj||[];const P=`'${it.id}',${ri}`;let prev=null;
 const rows=st.map(s=>{const d=ch[s.k];const ob=obj.filter(x=>x.k===s.k);const isC=cur&&cur.k===s.k;
  let h=`<li class="${d?'d':''} ${isC?'c':''}">${d?'✓':'○'} ${esc(s.l)}${d?` <span class="meta">${fmtD(d.date)}${d.no?' · No '+esc(d.no):''}${d.amt?' · '+rsL(d.amt):''}${d.note?' · '+esc(d.note):''}</span>`:''}${isC&&prev?` <span class="meta">· waiting ${diffDays(today(),prev)}d</span>`:''}`;
  if(ob.length)h+=`<div style="margin:2px 0 4px 18px;font-size:13px">${ob.map((x,i)=>`<div><span class="${x.addrD?'meta':'rd'}">Objection ${i+1} · ${fmtD(x.d)}:</span> ${esc(x.text)}${x.addrD?` <span class="meta">→ addressed, resubmitted ${fmtD(x.addrD)}${x.addr?': '+esc(x.addr):''}</span>`:''}</div>`).join('')}</div>`;
  if(d)prev=d.date;return h+'</li>'}).join('');
 let act='';if(cur&&!it.resolved){const oo=obj.filter(x=>x.k===cur.k&&!x.addrD);
  act=cur.t==='check'?(oo.length?`<button class="btn p" onclick="A.chObjAddr(${P})">Objection addressed, resubmitted</button>`:`<button class="btn p" onclick="A.chDone(${P})">Passed</button><button class="btn" onclick="A.chObj(${P})">Objection raised</button>`):`<button class="btn p" onclick="A.chDone(${P})">${cur.t==='memo'?'Record approval memo':cur.t==='letter'?'Record No and date':'Mark done'}</button>`;
  act=`<div class="ct mt">Now: ${esc(cur.l)}</div><div class="acts">${act}</div>`}
 const anyDone=st.some(s=>ch[s.k]&&ch[s.k].date)&&!(ri<0&&st.filter(s=>ch[s.k]&&ch[s.k].date).length===1&&ch.rcv);
 return `<ol class="stg">${rows}</ol>${act}${anyDone&&!it.resolved?`<div class="mt"><a href="javascript:void 0" class="meta" onclick="A.chUndo(${P})">Undo last step</a></div>`:''}`}
A.chDone=(id,ri)=>{const it=get(id);const s=curStep(it,ri);if(!s)return;let warn='';
 if(ri<0&&s.k==='fwd'){const a=chkList(it,'att:',estAtt(it)),g=chkList(it,'sig:',estSig(it));if(a.n<a.all||g.n<g.all)warn=`<div class="card warn mt">Checklist incomplete: ${a.all-a.n} attachment(s), ${g.all-g.n} signature(s) not ticked.</div>`}
 sheet(`<div class="ct">${esc(s.l)}</div>${warn}<label class="fld mt"><span>Date</span><input type="date" id="cdD" value="${today()}"></label>${s.t==='letter'||s.t==='memo'?`<label class="fld"><span>${s.t==='memo'?'Memo No':'Letter No'}</span><input id="cdN"></label>`:''}${s.t==='memo'?`<label class="fld"><span>${ri<0?'Sanctioned amount (Rs)':'Amount (Rs, if stated)'}</span><input id="cdA" type="number" inputmode="decimal" value="${ri<0?esc(it.amount||''):''}"></label>`:''}<label class="fld"><span>Note (optional)</span><input id="cdT"></label><button class="btn p wide" onclick="A.chDoneSave('${id}',${ri})">Save</button>${s.t==='memo'?'<p class="meta">Attach the memo under Documents.</p>':''}`)};
A.chDoneSave=(id,ri)=>{const it=get(id);const s=curStep(it,ri);const o=chainOf(it,ri);const r={date:$('#cdD').value||today(),note:$('#cdT').value.trim()};if($('#cdN'))r.no=$('#cdN').value.trim();if($('#cdA')&&$('#cdA').value)r.amt=$('#cdA').value;
 if((s.t==='letter'||s.t==='memo')&&!r.no)return toast('Enter the No');snap();o.ch=o.ch||{};o.ch[s.k]=r;const nm=(ri>=0?'Revalidation: ':'')+s.l;it.stages.push({name:nm,date:r.date,note:r.no?'No '+r.no:r.note});it.doneOn=today();log('Stage: '+it.title+': '+nm,it);save();closeSheet();render();toast('Saved',1)};
A.chObj=(id,ri)=>{const s=curStep(get(id),ri);sheet(`<div class="ct">Objection: ${esc(s.l)}</div><label class="fld mt"><span>Date</span><input type="date" id="obD" value="${today()}"></label><label class="fld"><span>Objection (missing attachment, calculation, title mismatch…)</span><textarea id="obT" rows="3"></textarea></label><button class="btn p wide" onclick="A.chObjSave('${id}',${ri})">Save objection</button>`)};
A.chObjSave=(id,ri)=>{const it=get(id);const s=curStep(it,ri);const tx=$('#obT').value.trim();if(!tx)return toast('Write the objection');snap();const o=chainOf(it,ri);(o.obj=o.obj||[]).push({k:s.k,d:$('#obD').value||today(),text:tx});it.doneOn=today();log('Objection at '+s.l+': '+it.title+' · '+tx,it);save();closeSheet();render();toast('Objection recorded',1)};
A.chObjAddr=(id,ri)=>{sheet(`<div class="ct">Objection addressed</div><label class="fld mt"><span>Resubmitted on</span><input type="date" id="oaD" value="${today()}"></label><label class="fld"><span>What was corrected</span><input id="oaT"></label><button class="btn p wide" onclick="A.chObjAddrSave('${id}',${ri})">Save</button>`)};
A.chObjAddrSave=(id,ri)=>{const it=get(id);const s=curStep(it,ri);const o=chainOf(it,ri);const x=(o.obj||[]).filter(z=>z.k===s.k&&!z.addrD).pop();if(!x)return closeSheet();snap();x.addrD=$('#oaD').value||today();x.addr=$('#oaT').value.trim();it.doneOn=today();log('Objection addressed at '+s.l+': '+it.title,it);save();closeSheet();render();toast('Resubmitted',1)};
A.chUndo=(id,ri)=>{const it=get(id);const o=chainOf(it,ri);const st=chainSteps(it,ri).filter(s=>o.ch&&o.ch[s.k]&&o.ch[s.k].date);const l=st.pop();if(!l||(ri<0&&l.k==='rcv'))return;if(!confirm('Undo "'+l.l+'"?'))return;snap();delete o.ch[l.k];const nm=(ri>=0?'Revalidation: ':'')+l.l;const i=it.stages.map(x=>x.name).lastIndexOf(nm);if(i>=0)it.stages.splice(i,1);log('Undone: '+nm+' · '+it.title,it);save();render();toast('Undone',1)};
function estSummary(it){const au=estAuth(it);const ft=reachFt(it);const x=xsCount(it);const s=it.ch&&it.ch.sanc;const sa=s&&s.amt?Number(s.amt):0,su=Number(it.amount)||0;
 const sen=person(it.owner);return `<dl class="kv">${it.wpName?`<dt>Work plan name</dt><dd>${esc(it.wpName)}</dd>`:''}${it.canal?`<dt>Canal</dt><dd>${esc(it.canal)}</dd>`:''}${sen?`<dt>Sub Engineer</dt><dd>${esc(sen.name)}</dd>`:''}${it.estNo?`<dt>Estimate No</dt><dd>${esc(it.estNo)}${it.estDate?' · '+fmtD(it.estDate):''}</dd>`:''}${it.due?`<dt>Target</dt><dd>${fmtD(it.due)}</dd>`:''}<dt>Type</dt><dd>${[it.scheme,it.closure,it.wtype].filter(Boolean).map(esc).join(' · ')||'-'}</dd>${ft?`<dt>Reaches</dt><dd>${reachesOf(it).map(r=>rdTxt(r.a)+' to '+rdTxt(r.b)).join(', ')} · ${(ft/1000).toString()} RDs</dd><dt>Cross-sections</dt><dd>${x} (every ${/500/.test(it.xsInt||'')?500:1000} ft) · red signature on ${xsRed(it)}</dd>`:''}<dt>Submitted</dt><dd>${rsL(su)||'-'}</dd><dt>Authority</dt><dd>${au}${it.authority&&it.authority!=='Auto'?'':' (auto from amount)'}${estNesp(it)?' · NESPAK vetting (Rs 10 lac+)':''}</dd>${it.items?`<dt>Items</dt><dd style="white-space:pre-wrap">${esc(it.items)}</dd>`:''}${s?`<dt>Sanctioned</dt><dd>${rsL(sa)||'-'}${sa&&su&&sa!==su?` <span class="${sa>su?'':'rd'}">(${sa>su?'+':'−'}${rs(Math.abs(sa-su)).replace('Rs ','Rs ')} vs submitted)</span>`:''}</dd><dt>Valid till</dt><dd class="${revalNeed(it)?'rd':''}">30 Jun ${validTill(it).slice(0,4)} (${fyTxt(validTill(it))})</dd>`:''}</dl>`}
function estBlock(it){const id=it.id;let h=`<h2>Part 1 · Sanction</h2><div class="card">${estSummary(it)}</div><div class="card">${chainHTML(it,-1)}</div>`;
 const old=(it.stages||[]).filter(s=>STG_OLD.includes(s.name));if(old.length)h+=`<details class="card"><summary class="meta">Earlier stage records (${old.length})</summary>${old.map(s=>`<div class="meta mt">${fmtD(s.date)} · ${esc(s.name)}${s.note?' · '+esc(s.note):''}</div>`).join('')}</details>`;
 if(!sancD(it)){const r=chkList(it,'rcv:',estRcv(it)),a=chkList(it,'att:',estAtt(it)),g=chkList(it,'sig:',estSig(it));
  h+=`<details class="card" ${!(it.ch&&it.ch.fwd)?'open':''}><summary><b>Checklists</b> <span class="meta">received ${r.n}/${r.all} · attachments ${a.n}/${a.all} · signatures ${g.n}/${g.all}</span></summary><div class="ct mt">Received from SEN</div>${r.html}<div class="ct mt">Attach before forwarding</div>${a.html}<div class="ct mt">Your signatures before forwarding</div>${g.html}</details>${(()=>{const sv=S.visits.filter(v=>v.estId===id).sort((a,b)=>b.date.localeCompare(a.date));return sv.length?`<div class="card"><div class="ct">Site checks (${sv.length})</div>${sv.slice(0,5).map(visitRow).join('')}</div>`:''})()}<div class="acts"><button class="btn s" onclick="A.estVisit('${id}')">+ Record field check visit</button></div>`;return h}

let HOX=false,HT=null,HTU=null,HC={k:'7d',f:'',t:''};
function custRange(){const t=today();if(HC.k==='week'){const w=weekStart(t);return [w,addDays(w,6),'This week']}if(HC.k==='month'){const m=t.slice(0,7);const e=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();return [m+'-01',m+'-'+pad(e),'This month']}if(HC.k==='pick'&&HC.f&&HC.t)return [HC.f<=HC.t?HC.f:HC.t,HC.f<=HC.t?HC.t:HC.f,'Dates'];return [t,addDays(t,7),'Next 7 days']}
function custItems(){const [f,e]=custRange();return S.items.filter(it=>inScope(it)&&(isOpen(it)||(it.type==='event'&&!it.resolved))).map(it=>{const ds=datesOf(it).map(x=>x.d).concat(it.followUp?[it.followUp]:[]).filter(d=>d>=f&&d<=e).sort();return ds.length?{it,d:ds[0]}:null}).filter(Boolean).sort((a,b)=>a.d.localeCompare(b.d)||priRank(a.it)-priRank(b.it)).map(x=>x.it)}

function homeTabBody(g){const L=a=>`<div class="list" style="margin-top:8px">${a.map(trow).join('')}</div>`;
 if(HT==='today'){const ov=g.over.concat(g.overF),cap=HOX?ov.length:5,nt=g.today.length+g.fu.length;if(!ov.length&&!nt)return '<p class="empty">Nothing overdue or due today.</p>';
  return `<div class="list" style="margin-top:8px">${ov.length?`<div class="subh" style="margin-top:0;color:var(--red)">Overdue (${ov.length})</div>`+ov.slice(0,cap).map(trow).join('')+(ov.length>cap?`<a class="arow" href="#" onclick="HOX=true;render();return false"><span class="an">See all ${ov.length} overdue</span><span class="chev">›</span></a>`:''):''}${nt?`<div class="subh" style="${ov.length?'':'margin-top:0'}">Due today (${nt})</div>`+g.today.map(trow).join('')+g.fu.map(trow).join(''):''}</div>`}
 if(HT==='soon')return g.soon.length?L(g.soon):'<p class="empty">Nothing in the next 2 days.</p>';
